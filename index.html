<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week — Family Menu Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --font-head:'Sora',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono','Roboto Mono',Consolas,monospace;
  --ink:#2A3B4C;
  --ink-soft:#5C6B7A;
  --ink-faint:#8B9AA8;
  --glass:rgba(255,255,255,0.55);
  --glass-strong:rgba(255,255,255,0.78);
  --glass-border:rgba(255,255,255,0.65);
  --teal:#2F8F8A;
  --teal-dark:#236b67;
  --status-proven:#3D8B86;
  --status-new:#C98A3E;
  --status-caution:#C15A4A;
  --white:#ffffff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  background:linear-gradient(160deg,#CFE0EC 0%,#BFE6E0 45%,#EAF4E6 100%);
  background-attachment:fixed;
  padding-bottom:40px;
}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 0;}

/* Header */
.header{text-align:center;margin-bottom:16px;}
.header h1{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.7rem;margin:0 0 3px;}
.header .sub{font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-soft);letter-spacing:0.03em;}

/* Utility row */
.util-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.util-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-head);font-weight:600;font-size:0.78rem;letter-spacing:-0.005em;
  color:var(--teal-dark);
  background:var(--glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
  border-radius:20px;padding:7px 13px;cursor:pointer;
}
.util-btn:hover{background:var(--glass-strong);}
.util-btn:disabled{opacity:0.6;cursor:default;}
.util-btn i{font-size:15px;}
.util-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.refresh-status-note{text-align:center;font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-soft);margin-bottom:14px;min-height:14px;}

/* Tabs */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:16px;padding:5px;margin-bottom:18px;position:sticky;top:12px;z-index:40;}
.panel{padding-top:8px;}
.tab{flex:1;font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:0.85rem;text-align:center;padding:9px 4px;background:transparent;color:var(--ink-soft);border:none;border-radius:12px;cursor:pointer;transition:background .15s ease, color .15s ease, box-shadow .15s ease;display:flex;align-items:center;justify-content:center;}
.tab:hover{color:var(--ink);}
.tab.active{background:var(--white);color:var(--teal-dark);box-shadow:0 3px 10px rgba(42,59,76,0.15);}
.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.hidden{display:none;}

/* Review box */
.review-box{background:rgba(255,255,255,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:0.85rem;}
.review-box .rb-title{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1rem;margin-bottom:4px;}
.review-box .rb-sub{font-size:0.78rem;color:var(--ink-soft);margin-bottom:12px;}
.review-box label{display:block;font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);margin-bottom:5px;}
.review-box textarea{width:100%;min-height:52px;border:1px solid var(--glass-border);border-radius:10px;padding:9px 10px;font-family:var(--font-body);font-size:0.85rem;resize:vertical;margin-bottom:10px;background:rgba(255,255,255,0.6);color:var(--ink);}
.review-box textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px;}
.review-saved-note{font-family:var(--font-mono);font-size:0.68rem;color:var(--status-proven);font-weight:600;min-height:14px;margin-bottom:6px;}
.review-submit-btn{width:100%;font-family:var(--font-head);font-weight:600;background:var(--teal);color:var(--white);border:none;padding:10px;border-radius:12px;font-size:0.85rem;cursor:pointer;}
.review-submit-btn:hover{background:var(--teal-dark);}
.review-submit-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}
.review-submit-btn.danger{background:var(--status-caution);}
.review-submit-btn.danger:hover{background:#a3493c;}
.review-submit-btn:disabled{opacity:0.65;cursor:default;}
.budget-toggle-row{display:flex !important;align-items:center;gap:8px;font-family:var(--font-body) !important;font-size:0.82rem !important;text-transform:none !important;color:var(--ink) !important;letter-spacing:normal !important;margin-bottom:12px;cursor:pointer;}
.budget-toggle-row input{accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;}

/* Compact/collapsed review box (always visible, low-emphasis by default) */
.review-box-compact{display:flex;align-items:center;gap:8px;width:100%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:9px 14px;margin-bottom:16px;cursor:pointer;font-family:var(--font-body);font-size:0.8rem;color:var(--ink-soft);text-align:left;}
.review-box-compact:hover{background:var(--glass-strong);color:var(--ink);}
.review-box-compact:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.review-box-compact i{font-size:16px;flex-shrink:0;}
.review-box-compact .chevron{margin-left:auto;}
.review-box-collapse{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--ink-faint);font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;padding:0;margin-bottom:10px;}
.review-box-collapse:hover{color:var(--ink-soft);}
.review-box-collapse:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}

/* Scoreboard */
.scoreboard{font-family:var(--font-mono);font-size:0.74rem;color:var(--ink-soft);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:9px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.dot.proven{background:var(--status-proven);}
.dot.new{background:var(--status-new);}

/* Day cards */
.days{display:flex;flex-direction:column;gap:14px;}
.day-card{position:relative;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:16px 18px;}
.glow{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%;}
.glow.proven{background:var(--status-proven);box-shadow:0 0 9px 2px rgba(61,139,134,0.55);}
.glow.new{background:var(--status-new);box-shadow:0 0 9px 2px rgba(201,138,62,0.55);}
.day-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.day-name{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.1rem;}
.day-status{font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;color:var(--ink-faint);letter-spacing:0.04em;}
.meal-row{display:flex;align-items:flex-start;gap:10px;font-size:0.86rem;padding:6px 0;border-top:1px solid rgba(42,59,76,0.08);}
.meal-row:first-of-type{border-top:none;}
.meal-label{font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;color:var(--ink-faint);width:44px;flex-shrink:0;padding-top:3px;letter-spacing:0.04em;}
.meal-name{flex:1;}
.meal-name-btn{background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;}
.meal-name-btn:hover{text-decoration:underline;}
.meal-name-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.badge-new{font-family:var(--font-mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--status-new);font-weight:600;margin-left:5px;}
.by-line{font-size:0.72rem;color:var(--ink-soft);font-style:italic;display:block;margin-top:1px;}
.log-btn{font-family:var(--font-head);font-size:0.68rem;font-weight:600;color:var(--teal-dark);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:10px;padding:5px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.log-btn.logged{background:var(--teal);color:var(--white);border-color:var(--teal);}
.log-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.remove-meal-btn{background:none;border:none;color:var(--ink-faint);opacity:0.4;padding:5px;cursor:pointer;border-radius:8px;flex-shrink:0;display:flex;align-items:center;font-size:15px;}
.remove-meal-btn:hover{opacity:1;color:var(--status-caution);background:rgba(193,90,74,0.1);}
.remove-meal-btn:focus-visible{opacity:1;outline:3px solid var(--teal);outline-offset:2px;}
.meal-row-empty{align-items:center;}
.add-meal-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-faint);background:none;border:1.5px dashed var(--glass-border);border-radius:10px;padding:8px;cursor:pointer;}
.add-meal-btn:hover{color:var(--teal-dark);border-color:var(--teal);}
.add-meal-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.prep-ahead-note{display:flex;align-items:flex-start;gap:6px;font-size:0.78rem;color:var(--status-new);background:rgba(201,138,62,0.1);border-radius:10px;padding:7px 10px;margin-bottom:10px;line-height:1.4;}
.prep-ahead-note i{margin-top:1px;flex-shrink:0;}

/* Shopping */
.shop-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:20px 18px 22px;}
.shop-card h2{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.25rem;margin:0 0 2px;text-align:center;}
.shop-sub{text-align:center;font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-soft);margin-bottom:16px;}
.cat{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal-dark);margin:16px 0 6px;border-bottom:1px solid rgba(42,59,76,0.12);padding-bottom:3px;}
.shop-cat-block:first-of-type .cat{margin-top:0;}
.item{display:flex;align-items:flex-start;gap:9px;padding:4px 0;font-size:0.85rem;cursor:pointer;}
.item input{margin-top:3px;accent-color:var(--teal);width:15px;height:15px;flex-shrink:0;}
.item span{flex:1;}
.item.checked span{text-decoration:line-through;opacity:0.5;}
.copy-btn{display:block;width:100%;margin:18px auto 0;font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;background:var(--teal);color:var(--white);border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;cursor:pointer;}
.copy-btn:hover{background:var(--teal-dark);}
.copy-btn.copied{background:var(--teal-dark);}
.copy-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}

/* Recipe tab */
.recipe-picker{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
.rp-btn{font-family:var(--font-mono);font-size:0.68rem;white-space:nowrap;background:rgba(255,255,255,0.5);border:1px solid var(--glass-border);padding:7px 12px;border-radius:10px;cursor:pointer;color:var(--ink-soft);}
.rp-btn.active{background:var(--teal);color:var(--white);border-color:var(--teal);}
.rp-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}
.recipe-card{background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:18px;padding:20px 20px 22px;}
.recipe-card h3{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.2rem;margin:0 0 2px;}
.recipe-card .by{font-size:0.75rem;font-style:italic;color:var(--ink-soft);margin-bottom:12px;}
.recipe-time-estimate{font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-faint);letter-spacing:0.02em;margin-bottom:10px;}
.recipe-card h4{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal-dark);margin:14px 0 6px;}
.recipe-card ul, .recipe-card ol{margin:0;padding-left:22px;font-size:0.86rem;line-height:1.65;}
.recipe-card li{margin-bottom:3px;}
.recipe-card .no-recipe{font-size:0.85rem;color:var(--ink-soft);}

/* Favourite save button (recipe card + favourites list) */
.favourite-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-head);font-weight:600;font-size:0.78rem;color:var(--teal-dark);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:20px;padding:7px 14px;cursor:pointer;margin-bottom:2px;text-decoration:none;}
.favourite-btn.saved{background:var(--teal);color:var(--white);border-color:var(--teal);cursor:default;}
.favourite-btn:disabled{opacity:0.7;}
.favourite-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.favourite-btn.add-link-btn{width:100%;justify-content:center;box-sizing:border-box;margin-top:10px;}
.favourite-status-note{font-family:var(--font-mono);font-size:0.68rem;color:var(--status-proven);margin:4px 0 6px;min-height:14px;}

/* Full-page overlays (Principles / Favourites / Favourite recipe detail) */
.overlay-page{position:fixed;inset:0;background:linear-gradient(160deg,#CFE0EC 0%,#BFE6E0 45%,#EAF4E6 100%);background-attachment:fixed;z-index:60;overflow-y:auto;}
.overlay-inner{max-width:640px;margin:0 auto;padding:26px 16px 40px;}

/* Auth gate */
body:not(.auth-pending) #authGate{display:none;}
body.auth-pending #hub{display:none;}
#authGate{z-index:100;display:flex;align-items:center;justify-content:center;}
.auth-inner{display:flex;flex-direction:column;align-items:center;width:100%;padding:26px 20px;}
.auth-brand{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:700;font-size:1.3rem;color:var(--ink);margin-bottom:20px;}
.auth-card{width:100%;max-width:360px;background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:18px;padding:24px 22px;}
.auth-card h2{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.15rem;margin:0 0 4px;}
.auth-card .section-sub{font-size:0.8rem;color:var(--ink-soft);margin-bottom:16px;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-family:var(--font-mono);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--glass-border);}
.auth-oauth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-head);font-weight:600;font-size:0.85rem;color:var(--ink);background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);border-radius:12px;padding:10px;cursor:pointer;margin-bottom:10px;}
.auth-oauth-btn:hover{background:var(--white);}
.auth-oauth-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.auth-switch-row{text-align:center;font-size:0.8rem;color:var(--ink-soft);margin-top:14px;}
.auth-link-btn{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--teal-dark);cursor:pointer;text-decoration:underline;}
.auth-forgot-row{text-align:right;margin:-8px 0 14px;}
.auth-status-note{font-family:var(--font-mono);font-size:0.7rem;color:var(--status-caution);min-height:14px;margin-bottom:10px;}
.auth-status-note.ok{color:var(--status-proven);}
.overlay-close{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-head);font-size:0.8rem;font-weight:600;color:var(--teal-dark);background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
.overlay-close:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.overlay-title{font-family:var(--font-head);letter-spacing:-0.01em;font-size:1.4rem;font-weight:600;color:var(--ink);margin:0 0 4px;}
.overlay-sub{font-size:0.82rem;color:var(--ink-soft);margin-bottom:16px;}

/* Onboarding */
.onboarding-icon{width:72px;height:72px;border-radius:20px;background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-size:32px;margin:22px auto 20px;box-shadow:0 8px 20px rgba(42,59,76,0.1);}
.onboarding-center{text-align:center;}
.onboarding-pitch-row{display:flex;gap:8px;margin:18px 0 22px;}
.onboarding-pitch-item{flex:1;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:12px 8px;text-align:center;font-size:0.7rem;color:var(--ink-soft);font-weight:600;line-height:1.35;}
.onboarding-pitch-item .icon{display:block;font-size:18px;margin-bottom:5px;}
.onboarding-section-label{font-family:var(--font-head);font-weight:600;font-size:0.9rem;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.onboarding-tag{font-family:var(--font-mono);font-size:0.6rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;}
.onboarding-tag.required{color:#a05a13;background:rgba(201,138,62,0.15);border:1px solid rgba(201,138,62,0.35);}
.onboarding-tag.optional{color:var(--teal-dark);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);}
.onboarding-hint{font-size:0.76rem;color:var(--ink-soft);margin:0 0 12px;line-height:1.45;}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.stepper-row:last-child{margin-bottom:0;}
.stepper-label{font-family:var(--font-head);font-weight:600;font-size:0.85rem;color:var(--ink);}
.stepper-control{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);border-radius:12px;padding:5px 6px;}
.stepper-btn{width:28px;height:28px;border-radius:8px;border:none;background:var(--teal);color:var(--white);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.stepper-btn:hover{background:var(--teal-dark);}
.stepper-btn:disabled{opacity:0.35;cursor:default;}
.stepper-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.stepper-value{min-width:20px;text-align:center;font-family:var(--font-mono);font-size:0.9rem;font-weight:600;color:var(--ink);}
.onboarding-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.onboarding-field-grid .full{grid-column:1/-1;}
.onboarding-preview-card{background:linear-gradient(180deg,rgba(255,255,255,0.75) 0%,rgba(230,246,239,0.55) 100%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:18px;padding:14px 16px;margin-bottom:14px;position:relative;transition:box-shadow .4s ease;}
.onboarding-preview-card.pulse{box-shadow:0 0 0 3px rgba(47,143,138,0.35);}
.onboarding-preview-eyebrow{font-family:var(--font-mono);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:var(--teal-dark);margin-bottom:8px;}
.onboarding-preview-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--ink-faint);font-size:16px;cursor:pointer;line-height:1;padding:2px;}
.onboarding-preview-close:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.onboarding-preview-line{font-size:0.82rem;color:var(--ink);line-height:1.6;}
.onboarding-preview-line b{font-weight:600;}

.loading-stage.show-bars .loading-bars{opacity:1;}

.loading-bars{display:flex;align-items:center;justify-content:center;gap:5px;height:40px;}
.loading-bars .bar{width:5px;border-radius:3px;background:var(--teal);height:10px;}
.loading-stage.show-bars .bar{animation-name:loading-bob;animation-duration:1.2s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;}
/* IMPORTANT: keep animation-delay as its own separate rule (do not fold into
   an animation shorthand on a more specific selector) — a shorthand on a
   higher-specificity rule will silently reset delay to 0 and kill the stagger,
   which is what actually creates the traveling-wave look. */
.loading-bars .bar:nth-child(1){animation-delay:0.00s;}
.loading-bars .bar:nth-child(2){animation-delay:0.10s;}
.loading-bars .bar:nth-child(3){animation-delay:0.20s;}
.loading-bars .bar:nth-child(4){animation-delay:0.30s;}
.loading-bars .bar:nth-child(5){animation-delay:0.40s;}
.loading-bars .bar:nth-child(6){animation-delay:0.50s;}
.loading-bars .bar:nth-child(7){animation-delay:0.60s;}
.loading-bars .bar:nth-child(8){animation-delay:0.70s;}
.loading-bars .bar:nth-child(9){animation-delay:0.80s;}
@keyframes loading-bob{0%,100%{height:10px;opacity:0.55;}50%{height:36px;opacity:1;}}

.loading-gear-wrap{width:36px;height:36px;}
.loading-gear{width:100%;height:100%;}
.loading-stage.show-gear .loading-gear{animation:loading-cranked-turn 6.4s linear infinite;transform-origin:50% 50%;}

  5.6%    { transform:rotate(-3deg); }
  7.5%    { transform:rotate(50deg); }
  9.4%    { transform:rotate(42deg); }

  18.1%   { transform:rotate(42deg); }
  20%     { transform:rotate(95deg); }
  21.9%   { transform:rotate(87deg); }

  30.6%   { transform:rotate(87deg); }
  32.5%   { transform:rotate(140deg); }
  34.4%   { transform:rotate(132deg); }
  37.5%   { transform:rotate(135deg); }
  43.1%   { transform:rotate(132deg); }
  45%     { transform:rotate(185deg); }
  46.9%   { transform:rotate(177deg); }
  50%     { transform:rotate(180deg); }
  55.6%   { transform:rotate(177deg); }
  57.5%   { transform:rotate(230deg); }
  59.4%   { transform:rotate(222deg); }
  62.5%   { transform:rotate(225deg); }
  68.1%   { transform:rotate(222deg); }
  70%     { transform:rotate(275deg); }
  71.9%   { transform:rotate(267deg); }
  75%     { transform:rotate(270deg); }
  80.6%   { transform:rotate(267deg); }
  82.5%   { transform:rotate(320deg); }

  87.5%   { transform:rotate(315deg); }
  93.1%   { transform:rotate(312deg); }

  100%    { transform:rotate(360deg); }
}

/* Pull-to-refresh */
.pull-refresh-indicator{position:fixed;top:0;left:50%;width:34px;height:34px;margin-left:-17px;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal-dark);opacity:0;transform:translate(-50%,-40px);transition:transform .15s ease;z-index:80;pointer-events:none;}
.pull-refresh-indicator.checking i{animation:pull-spin 0.8s linear infinite;}
@keyframes pull-spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--white);font-family:var(--font-head);font-size:0.8rem;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .2s ease, transform .2s ease;z-index:90;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
  .pull-refresh-indicator.checking i{animation:none !important;}
  .loading-stage{height:auto;position:static;display:block;}
  .loading-stage > *{position:static;opacity:1 !important;transition:none;}
  .loading-bars, .loading-gear-wrap{display:none;}
  .loading-stage::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--teal);}
  .loading-bars .bar, .loading-gear{animation:none !important;}
}

<script>
(function(){
  // ---- Multi-tenant re-platform: WEEK_DATA/PRINCIPLES_TEXT/FAVOURITES are fetched live from
  // Supabase per signed-in household in loadHouseholdData(), below. The 3 AI-generation actions
  // (refresh plan, generate a meal, read a recipe link) call Supabase Edge Functions directly,
  // authenticated with the signed-in user's own JWT -- see callEdgeFunction(). FEEDBACK_ENDPOINT/
  // READ_KEY below are legacy (the old Apps Script backend) and no longer used by this file. ----
  const FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/AKfycbwQXFwbeGLuhF8XA08NpEiWmCRscGNjxTt0wN3lGc73Pk-7PXLPMwU4dexHaRbQDRAWMw/exec";
  const FEEDBACK_EMAIL = "mark.j.barber@gmail.com";
  const READ_KEY = "family-menu-2026"; // must match Apps Script's READ_KEY — it's a light lock, not real security

  // Safe to expose publicly — this is Supabase's anon/publishable key, meant to sit in
  // frontend code. Real data isolation is enforced at the database layer by Row-Level
  // Security policies keyed on the signed-in household's own auth user id, not by
  // hiding this key. Never put the service_role/secret key here.
  const SUPABASE_URL = "https://jpofeslziyjbysotycfl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_psBedalpZIlxs5DaGQPf1g_yJ49IdI8";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Calls one of the 3 AI-generation Edge Functions, forwarding the signed-in user's own access
  // token so the function's RLS-scoped Supabase client only ever sees this household's data.
  // Always returns the parsed JSON body, since every Edge Function responds with a
  // {status:"error", message} shape on failure rather than relying on HTTP status alone.
  async function callEdgeFunction(name, payload){
    const { data: { session } } = await supabaseClient.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify(payload)
    });
    return resp.json();
  }

  let WEEK_DATA = null;

  let PRINCIPLES_TEXT = '';

  let FAVOURITES = [];

  let dishStats = {};
  let shoppingState = {};
  let recipeTabIndex = 0;
  let recipeTabInitialized = false;
  let currentHouseholdId = null; // = household.id = the signed-in auth user's id; set in loadHouseholdData()
  let householdOnboardingIncomplete = false; // true only for a just-skipped household viewing the app this visit
  let currentHouseholdRow = null; // full row, cached only when householdOnboardingIncomplete — see renderHistoryBanner()'s "Finish setup"
  let currentWeekRowId = null; // weeks.id (uuid) for the current week, needed to scope meals queries

  function slugify(name){ return String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
  function shopItemKey(cat, name){ return cat + '::' + String(name).toLowerCase(); }
  function key(day, meal){ return day + "-" + meal; }

  const CATEGORY_ORDER = ['produce','meat_deli','dairy','pantry','frozen','other'];
  const CATEGORY_LABELS = {produce:'Produce', meat_deli:'Meat & deli', dairy:'Dairy', pantry:'Pantry', frozen:'Frozen', other:'Other'};

  // Only pluralize count-noun units ("clove" -> "cloves") — abbreviations like g/kg/tbsp/cup
  // read wrong pluralized ("600 gs") and are conventionally left singular in ingredient lists.
  const PLURALIZABLE_UNITS = ['clove','head','bunch','rasher','block','bag','bottle','packet'];
  function formatQuantityUnit(qty, unit){
    if(qty == null || qty === '') return '';
    const qtyStr = Number.isInteger(qty) ? String(qty) : String(Math.round(qty*100)/100);
    if(!unit) return qtyStr;
    const lower = unit.toLowerCase();
    const pluralUnit = (PLURALIZABLE_UNITS.includes(lower) && qty !== 1) ? unit + 's' : unit;
    return `${qtyStr} ${pluralUnit}`;
  }
  function formatIngredientLine(x){
    return `${formatQuantityUnit(x.quantity, x.unit)} ${x.name}`.replace(/\s+/g,' ').trim();
  }

  // Low-emphasis "Prep: 15 min · Cook: 25 min" label, appending hands-off time when present.
  // Renders nothing if neither prep_time nor cook_time is set (e.g. an external recipe whose
  // source page didn't state one).
  function timeEstimateHtml(info){
    if(!info.prep_time && !info.cook_time) return '';
    const parts = [];
    if(info.prep_time) parts.push(`Prep: ${info.prep_time}`);
    if(info.cook_time) parts.push(`Cook: ${info.cook_time}`);
    let text = parts.join(' · ');
    if(info.hands_off_time) text += ` · Plus ${info.hands_off_time}`;
    return `<div class="recipe-time-estimate">${text}</div>`;
  }

  // Computed aggregation across every meal still in the week — dropping a meal drops its
  // ingredients automatically, adding one merges in. Sums quantities only when an ingredient's
  // canonical name AND unit match exactly across meals; otherwise lists them separately
  // (best-effort, per the product spec — not worth a full unit-conversion system).
  function computeShoppingList(days){
    const totals = {};
    days.forEach(d=>{
      ['lunch','snack','dinner'].forEach(m=>{
        const info = d[m];
        if(!info || !info.ingredients) return;
        info.ingredients.forEach(ing=>{
          if(!ing || !ing.name) return;
          const category = CATEGORY_ORDER.includes(ing.category) ? ing.category : 'other';
          const nameKey = String(ing.name).toLowerCase();
          const tKey = category + '::' + nameKey;
          if(!totals[tKey]) totals[tKey] = {category, name: ing.name, quantity: 0, unit: '', hasQty: false, mixedUnits: false};
          const t = totals[tKey];
          if(typeof ing.quantity === 'number'){
            if(!t.hasQty){
              t.quantity = ing.quantity;
              t.unit = ing.unit || '';
              t.hasQty = true;
            } else if((ing.unit || '') === t.unit){
              t.quantity += ing.quantity;
            } else {
              t.mixedUnits = true;
            }
          }
        });
      });
    });
    const byCategory = {};
    CATEGORY_ORDER.forEach(c => byCategory[c] = []);
    Object.values(totals).forEach(t=>{
      const label = (t.hasQty && !t.mixedUnits)
        ? formatIngredientLine({quantity: t.quantity, unit: t.unit, name: t.name})
        : t.name;
      const capitalized = label.charAt(0).toUpperCase() + label.slice(1);
      byCategory[t.category].push({key: shopItemKey(t.category, t.name), label: capitalized});
    });
    return byCategory;
  }

  // Which meals have been logged on THIS device (cosmetic only — the real record is the Sheet)
  let loggedLocally = {};
  try { loggedLocally = JSON.parse(localStorage.getItem('menu-hub-logged:' + WEEK_DATA.week_id) || '{}'); } catch(e) { loggedLocally = {}; }
  function markLoggedLocally(day, meal){
    loggedLocally[key(day,meal)] = true;
    try { localStorage.setItem('menu-hub-logged:' + WEEK_DATA.week_id, JSON.stringify(loggedLocally)); } catch(e){}
  }

  // Fire-and-forget POST to the Apps Script endpoint. Uses no-cors + text/plain so it
  // doesn't trigger a CORS preflight (Apps Script web apps don't handle preflight well).
  // That also means we can't read a real success/failure response — this always resolves
  // once the request is sent, not once it's confirmed received. Used only for write-only,
  // no-response-needed submissions (review feedback, per-meal Log).
  function sendToSheet(payload){
    if(!FEEDBACK_ENDPOINT || FEEDBACK_ENDPOINT.indexOf('PASTE_') === 0){
      return Promise.reject(new Error('Feedback endpoint not configured yet'));
    }
    return fetch(FEEDBACK_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }

  // Mirrors Code.gs's getDishFeedbackStats() exactly: proven requires at least half the
  // recorded reactions to be yes/mostly, and more positives than nos.
  async function fetchDishStats(){
    try{
      const { data: rows, error } = await supabaseClient
        .from('feedback').select('meal_name, kids_ate_it, parent_rating').eq('type', 'meal_feedback');
      if(error) throw error;
      const stats = {};
      (rows || []).forEach(r => {
        if(!r.meal_name) return;
        const key = r.meal_name;
        if(!stats[key]) stats[key] = { yes: 0, mostly: 0, no: 0, total: 0, ratingSum: 0, ratingCount: 0 };
        const s = stats[key];
        if(r.kids_ate_it === 'yes'){ s.yes++; s.total++; }
        else if(r.kids_ate_it === 'mostly'){ s.mostly++; s.total++; }
        else if(r.kids_ate_it === 'no'){ s.no++; s.total++; }
        if(r.parent_rating){ s.ratingSum += Number(r.parent_rating); s.ratingCount++; }
      });
      Object.keys(stats).forEach(key => {
        const s = stats[key];
        const positive = s.yes + s.mostly;
        s.status = (s.total > 0 && positive >= s.total / 2 && positive > s.no) ? 'proven' : 'new';
        s.avg_parent_rating = s.ratingCount ? Math.round((s.ratingSum / s.ratingCount) * 10) / 10 : null;
        delete s.ratingSum;
        delete s.ratingCount;
      });
      dishStats = stats;
    }catch(e){ /* leave dishStats empty — everything just renders as "new attempt" */ }
  }

  // Shared loading indicator (weekly-board-loading-animation-spec.md): a two-stage
  // looping animation — bar wave, then a cranked gear turning against resistance —
  // cross-fading into each other, reused everywhere a real network/processing wait
  // applies. Renders into `container` and starts the loop; returns a function that
  // stops the loop, which every call site must invoke once the wait ends.
  function showLoadingIndicator(container, labelText){
    container.innerHTML = `
      <div class="loading-indicator">
        <div class="loading-stage show-bars">
          <div class="loading-bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div class="loading-gear-wrap">
            <svg class="loading-gear" viewBox="0 0 36 36">
              <g fill="var(--teal)">
                <circle cx="18" cy="18" r="8"/>
                <rect x="16" y="3" width="4" height="6" rx="1.5"/>
                <rect x="16" y="27" width="4" height="6" rx="1.5"/>
                <rect x="16" y="3" width="4" height="6" rx="1.5" transform="rotate(45 18 18)"/>
                <rect x="16" y="27" width="4" height="6" rx="1.5" transform="rotate(45 18 18)"/>
                <rect x="16" y="3" width="4" height="6" rx="1.5" transform="rotate(90 18 18)"/>
                <rect x="16" y="27" width="4" height="6" rx="1.5" transform="rotate(90 18 18)"/>
                <rect x="16" y="3" width="4" height="6" rx="1.5" transform="rotate(135 18 18)"/>
                <rect x="16" y="27" width="4" height="6" rx="1.5" transform="rotate(135 18 18)"/>
              </g>
              <circle cx="18" cy="18" r="3.5" fill="var(--glass-strong)"/>
            </svg>
          </div>
        </div>
        <div class="loading-label"></div>
      </div>`;
    return startLoadingAnimation(container.querySelector(".loading-stage"), container.querySelector(".loading-label"), labelText);
  }

  function startLoadingAnimation(stageEl, labelEl, labelText){
    labelEl.textContent = labelText;
    const BAR_MS = 2400;
    const GEAR_MS = 6400;
    let cancelled = false;
    function loop(){
      if(cancelled) return;
      stageEl.classList.remove('show-gear');
      stageEl.classList.add('show-bars');
      setTimeout(() => {
        if(cancelled) return;
        stageEl.classList.remove('show-bars');
        stageEl.classList.add('show-gear');
        setTimeout(loop, GEAR_MS);
      }, BAR_MS);
    }
    loop();
    return () => { cancelled = true; };
  }

  async function regenerateMealFlow(day, meal, backdrop){
    const modal = backdrop.querySelector(".modal");
    modal.innerHTML = `<h3>Generating…</h3><div class="meal-sub">${day} · ${meal}</div><div class="loadingSlot"></div>`;
    const stopLoading = showLoadingIndicator(modal.querySelector(".loadingSlot"), "This can take up to two minutes — keep this tab open.");
    try{
      const result = await callEdgeFunction('regenerate-meal', {day, meal});
      stopLoading();
      if(result.status === "ok"){
        applyWeekPatch(await fetchCurrentWeekData());
        backdrop.remove();
      } else {
        renderRegenerateRetry(day, meal, backdrop, result.message || "Unknown error");
      }
    }catch(e){
      stopLoading();
      renderRegenerateRetry(day, meal, backdrop, "Lost the connection while waiting — it may have still gone through. Check the Plan tab before trying again.");
    }
  }

    function composePrinciplesText(){
      if(!isDefaultState) return page.querySelector("#principlesTextarea").value;
      const lines = [];
      page.querySelectorAll('[data-principle-id]').forEach(cb=>{
        if(cb.checked){
          const preset = DEFAULT_PRINCIPLES.find(p => p.id === cb.dataset.principleId);
          if(preset) lines.push('- ' + preset.text);
        }
      });
      const freeText = page.querySelector("#principlesFreeText").value.trim();
      if(freeText){
        freeText.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
          lines.push(l.charAt(0) === '-' ? l : '- ' + l);
        });
      }
      return lines.join('\n');
    }

    if(isDefaultState){
      page.querySelectorAll('[data-principle-id]').forEach(cb => cb.addEventListener('change', markDirty));

        await supabaseClient.from('feedback').insert({

        });
        PRINCIPLES_TEXT = text;
        principlesDirty = false;
        note.textContent = "Saved ✓";
      }catch(e){
        note.textContent = "Couldn't send — try again in a moment";
      }
    });

    page.querySelector("#addHistoryBtn").addEventListener("click", ()=> openMealHistoryUpload());
  }

  // Shared by the Settings-triggered "Add meal history" flow and onboarding Screen 3 -- same
  // form, same save action (a type:"meal_feedback" row), exactly one place this logic lives.
  // onSaved(description) fires after each successful save so each caller can update its own
  // chrome (session note / running chip list / onboarding's live preview) without this helper
  // knowing which context it's in.
  function renderMealHistoryFormInto(container, onSaved){
      let fetchedRecipe = null;
      let feedback = null;
      container.innerHTML = `
        <div class="history-form-card">
          <div class="modal-label">Description</div>
          <textarea id="historyDescInput" rows="3" placeholder="What was the meal?"></textarea>

            <button class="stamp" data-v="mostly">Mostly</button>
            <button class="stamp" data-v="no">Not really</button>
          </div>
          <textarea id="historyNoteInput" rows="2" placeholder="Optional note"></textarea>

          <div class="modal-status-note" id="historySaveNote"></div>
          <button class="primary-btn" id="historySaveBtn">Save &amp; add another</button>
        </div>`;

      const feedbackRow = container.querySelector("#historyFeedbackRow");
      feedbackRow.querySelectorAll(".stamp").forEach(b=>{
        b.addEventListener("click", ()=>{
          feedback = feedback === b.dataset.v ? null : b.dataset.v;
          feedbackRow.querySelectorAll(".stamp").forEach(x=>x.className = "stamp");
          if(feedback) feedbackRow.querySelector(`[data-v="${feedback}"]`).classList.add("sel-" + feedback);
        });
      });

      container.querySelector("#historyFetchLinkBtn").addEventListener("click", async ()=>{
        const url = container.querySelector("#historyLinkInput").value.trim();
        const note = container.querySelector("#historyLinkNote");
        const btn = container.querySelector("#historyFetchLinkBtn");
        const previewEl = container.querySelector("#historyIngredientsPreview");
        if(!url){ note.textContent = "Paste a URL first"; return; }
        btn.disabled = true; btn.textContent = "Fetching…"; previewEl.innerHTML = "";
        const stopLoading = showLoadingIndicator(note, "Reading that recipe…");
        try{
          const result = await callEdgeFunction('preview-external-recipe', {url});
          stopLoading();
          if(result.status === "ok"){
            fetchedRecipe = result.recipe;
            previewEl.innerHTML = `<ul class="preview-ingredients">${result.recipe.ingredients.map(i => `<li>${i.display || i.name}</li>`).join('')}</ul>`;
            note.textContent = "Recipe read ✓";
          } else {
            fetchedRecipe = null;
            note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't read that link — the meal will still save without it.`;
          }
        }catch(e){
          stopLoading();
          fetchedRecipe = null;
          note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't read that link — the meal will still save without it.`;
        }finally{
          btn.disabled = false; btn.textContent = "Fetch recipe";
        }
      });

      container.querySelector("#historySaveBtn").addEventListener("click", async ()=>{
        const desc = container.querySelector("#historyDescInput").value.trim();
        const note = container.querySelector("#historySaveNote");
        const btn = container.querySelector("#historySaveBtn");
        if(!desc){ note.textContent = "Add a description first"; return; }
        btn.disabled = true; btn.textContent = "Saving…"; note.textContent = "";
        const url = container.querySelector("#historyLinkInput").value.trim();
        const freeNote = container.querySelector("#historyNoteInput").value.trim();
        try{
          const { error } = await supabaseClient.from('feedback').insert({
            household_id: currentHouseholdId,
            type: "meal_feedback",
            day: null,
            meal: "History upload",
            meal_name: desc,
            source_url: url || null,
            ingredients_json: fetchedRecipe ? fetchedRecipe.ingredients : null,
            kids_ate_it: feedback || "yes",
            note: freeNote || null
          });
          if(!error){
            markHistoryUploaded();
            renderHistoryBanner();
            onSaved(desc);
            renderMealHistoryFormInto(container, onSaved);
          } else {
            note.textContent = "Couldn't save: " + (error.message || "unknown error");
            btn.disabled = false; btn.textContent = "Save & add another";
          }
        }catch(e){
          note.textContent = "Couldn't reach the server — try again.";
          btn.disabled = false; btn.textContent = "Save & add another";
        }
      });
  }
