  // Shared by the top-level Refresh plan button and the review box's "Update plan with this"
  // button -- both trigger the exact same regenerate-now call and data refresh, just with
  // different button/note elements to update while it runs. Returns true on success so callers
  // (like the review box) know whether it's safe to collapse/reset their own UI afterward.
  async function runRegenerate(btn, note, workingLabel){
    if(btn.disabled) return false;
    btn.disabled = true;
    const originalLabel = btn.innerHTML;
    btn.innerHTML = workingLabel;
    const stopLoading = showLoadingIndicator(note, "Generating your plan…");
    try{
      const result = await callEdgeFunction('regenerate-now', {});
      stopLoading();
      if(result.status === "ok"){
        note.textContent = "Updated ✓" + (result.summary ? " — " + result.summary : "");
        await fetchShoppingState();
        applyWeekPatch(await fetchCurrentWeekData());
        return true;
      } else {
        note.textContent = "Refresh failed: " + (result.message || "unknown error");
        return false;
      }
    }catch(e){
      stopLoading();
      note.textContent = "Lost the connection while waiting — it may have still gone through. Reload in a moment to check before trying again.";
      return false;
    }finally{
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    }
  }

  async function requestRegenerate(){
    await runRegenerate(
      document.getElementById("refreshPlanBtn"),
      document.getElementById("refreshStatusNote"),
      '<i class="ti ti-refresh"></i>Refreshing… (up to a few minutes)'
    );
  }

  document.getElementById("settingsBtn").addEventListener("click", openSettingsPage);
  document.getElementById("refreshPlanBtn").addEventListener("click", requestRegenerate);
  document.getElementById("favouritesLinkBtn").addEventListener("click", openFavouritesPage);

  function switchTab(name){
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("hidden", p.id !== "panel-" + name));
    if(name === "recipe"){
      if(!recipeTabInitialized){
        renderRecipeTab();
        recipeTabInitialized = true;
      }
      window.scrollTo(0, 0);
    }
  }

  function goToRecipe(dayIndex){
    recipeTabIndex = dayIndex;
    switchTab("recipe");
    renderRecipeTab();
  }

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=> switchTab(tab.dataset.tab));
  });

  const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const MEAL_FIELDS = ["name","ingredients","method","source","new_or_repeat","authored_by",
    "prep_time","cook_time","hands_off_time","prep_ahead_note"];

  // Fetches this signed-in household's own data (RLS scopes every query to auth.uid()
  // automatically — no household_id filter needed anywhere here) and populates
  // WEEK_DATA/PRINCIPLES_TEXT/FAVOURITES in the shape the rest of the app already expects,
  // so no other render function needs to change. Returns false if no household row exists
  // yet (a signed-in user who hasn't been onboarded — task for a later step).
  async function refreshFavourites(){
    const { data: favourites, error } = await supabaseClient.from('favourites').select('*').order('saved_at');
    if(error) throw error;
    FAVOURITES = (favourites || []).map(f => ({
      id: f.id, name: f.name, authored_by: f.authored_by, recipe: f.recipe,
      saved_at: f.saved_at, requested_for_next_week: f.requested_for_next_week
    }));
    return FAVOURITES;
  }

  // Returns {status:'no_household'} | {status:'onboarding_incomplete', household} | {status:'ready'}.
  // onboarding_completed_at (not just "does a households row exist") gates the app shell — see
  // startOnboarding() below, which handles both incomplete states identically to resumability.
  // ignoreOnboardingGate lets a just-skipped onboarding session enter the app shell for *this*
  // visit without a fresh onboarding_completed_at — see endOnboardingSkipped(). A later fresh
  // load still goes through the normal gate and correctly resumes onboarding: this flag only
  // ever applies to the in-session transition immediately after clicking Skip, never persists.
  async function loadHouseholdData(opts){
    opts = opts || {};
    const { data: households, error: hErr } = await supabaseClient.from('households').select('*').limit(1);
    if(hErr) throw hErr;
    const household = households && households[0];
    if(!household) return { status: 'no_household' };
    if(!household.onboarding_completed_at && !opts.ignoreOnboardingGate) return { status: 'onboarding_incomplete', household };
    // Only ever true via the ignoreOnboardingGate path (a just-skipped household entering the
    // app for this visit) -- renderHistoryBanner() reads this to nudge about the skipped
    // principles/household/board setup, not just meal history.
    householdOnboardingIncomplete = !household.onboarding_completed_at;
    currentHouseholdRow = householdOnboardingIncomplete ? household : null;
    currentHouseholdId = household.id;

    await refreshFavourites();

    PRINCIPLES_TEXT = (household.key_principles || [])
      .map(p => (String(p).trim().charAt(0) === '-' ? p : '- ' + p)).join('\n');

    WEEK_DATA = await fetchCurrentWeekData();

    return { status: 'ready' };
  }

  // Rebuilds the WEEK_DATA-shaped object from the current `weeks` + `meals` rows. Used on
  // initial load and after any mutation that changes a meal, so the UI reflects the real
  // database state rather than an optimistic local patch.
  async function fetchCurrentWeekData(){
    const { data: weeks, error: wErr } = await supabaseClient
      .from('weeks').select('*').eq('is_current', true).limit(1);
    if(wErr) throw wErr;
    const week = weeks && weeks[0];
    currentWeekRowId = week ? week.id : null;

    let days = DAY_NAMES.map(day => ({ day, dinner: null, lunch: null, snack: null }));
    if(week){
      const { data: meals, error: mErr } = await supabaseClient
        .from('meals').select('*').eq('week_id', week.id);
      if(mErr) throw mErr;
      days = DAY_NAMES.map(day => {
        const dayObj = { day };
        ["dinner","lunch","snack"].forEach(slot => {
          const m = (meals || []).find(x => x.day === day && x.slot === slot);
          if(!m || !m.name){ dayObj[slot] = null; return; }
          const info = {};
          MEAL_FIELDS.forEach(field => {
            const val = m[field];
            if(val !== null && val !== undefined && !(Array.isArray(val) && val.length === 0 && field !== "ingredients")){
              info[field] = val;
            }
          });
          if(!info.ingredients) info.ingredients = [];
          dayObj[slot] = info;
        });
        return dayObj;
      });
    }

    return week ? {
      week_id: week.week_id,
      date_range: week.date_range,
      pantry_ingredients: week.pantry_ingredients || [],
      budget_saver_mode: week.budget_saver_mode,
      board_notes: week.board_notes,
      days,
    } : { week_id: '', date_range: 'No plan generated yet', pantry_ingredients: [], budget_saver_mode: false, days };
  }

  async function init(stopLoading){
    let result;
    try{
      result = await loadHouseholdData();
    }catch(e){
      stopLoading();
      document.getElementById("authCard").innerHTML = `<div class="no-recipe">Couldn't load your household data — try reloading the page.</div>`;
      return;
    }

    if(result.status !== 'ready'){
      stopLoading();
      // Both "no households row at all" and "row exists but onboarding never finished" resume
      // into onboarding at the correct screen — see startOnboarding()'s own branching.
      startOnboarding(result.household || null);
      return;
    }

    await renderAppShellReady(stopLoading);
  }

  // Shared by init()'s normal ready path and endOnboardingSkipped()'s in-session bypass —
  // exactly one place that reveals #hub and populates it from whatever WEEK_DATA/PRINCIPLES_TEXT
  // loadHouseholdData() just set, so there's no risk of the two paths drifting apart.
  async function renderAppShellReady(stopLoading){
    document.getElementById("headerTitle").textContent = "This week";
    document.getElementById("headerSub").textContent = (WEEK_DATA.date_range || "—").toUpperCase();
    renderPlan();
    renderShopping();
    renderHistoryBanner();

    stopLoading();
    document.body.classList.remove('auth-pending');

    await Promise.all([fetchDishStats(), fetchShoppingState()]);
    renderPlan();
    renderShopping();
  }

  // ---------------- Pull-to-refresh (app-code updates only, not a data refresh) ----------------
  // GitHub Pages' CDN caches index.html for several minutes, so a check right after a fresh
  // deploy may still report "up to date" until that edge cache expires — an accepted limitation
  // of the static-hosting setup, not a bug in the gesture itself.
  (function initPullToRefresh(){
    let startY = null, pulling = false, currentPull = 0, checking = false;
    const THRESHOLD = 70;
    let initialLastModified = null;

    fetch(location.pathname, {method:'HEAD', cache:'no-store'})
      .then(r => { initialLastModified = r.headers.get('Last-Modified'); })
      .catch(()=>{});

    const indicator = document.createElement('div');
    indicator.className = 'pull-refresh-indicator';
    indicator.innerHTML = '<i class="ti ti-rotate-clockwise"></i>';
    document.body.appendChild(indicator);

    function showToast(msg){
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(()=> t.classList.add('show'));
      setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=> t.remove(), 300); }, 2200);
    }

    function resetIndicator(){
      indicator.classList.remove('pulling','checking');
      indicator.style.opacity = '';
      indicator.style.transform = '';
      currentPull = 0;
    }

    async function checkForUpdate(){
      checking = true;
      indicator.classList.add('checking');
      indicator.classList.remove('pulling');
      try{
        const resp = await fetch(location.pathname, {method:'HEAD', cache:'no-store'});
        const lm = resp.headers.get('Last-Modified');
        if(initialLastModified && lm && lm !== initialLastModified){
          showToast('Updated.');
          setTimeout(()=> location.reload(), 400);
        } else {
          showToast('Up to date.');
        }
      }catch(e){
        showToast("Couldn't check for updates");
      }finally{
        checking = false;
        resetIndicator();
      }
    }

    window.addEventListener('touchstart', (e)=>{
      if(checking) return;
      if(window.scrollY <= 0 && e.touches.length === 1){
        startY = e.touches[0].clientY;
        pulling = true;
      } else {
        startY = null; pulling = false;
      }
    }, {passive:true});

    window.addEventListener('touchmove', (e)=>{
      if(!pulling || startY == null || checking) return;
      const dy = e.touches[0].clientY - startY;
      if(dy > 0 && window.scrollY <= 0){
        currentPull = Math.min(dy, 120);
        indicator.classList.add('pulling');
        indicator.style.opacity = String(Math.min(currentPull / THRESHOLD, 1));
        indicator.style.transform = `translate(-50%, ${Math.min(currentPull, 60) - 34}px) rotate(${currentPull * 3}deg)`;
      } else {
        pulling = false;
      }
    }, {passive:true});

    window.addEventListener('touchend', ()=>{
      if(pulling && currentPull > THRESHOLD && !checking){
        checkForUpdate();
      } else if(!checking){
        resetIndicator();
      }
      pulling = false;
      startY = null;
    }, {passive:true});
  })();

  // ---------------- Auth gate (Supabase) ----------------
  // Email/password only for now. Google sign-in has a code path (checkAuthLinkError's
  // access_denied branch) ready for whenever the button comes back, but no OAuth client is
  // configured in Supabase yet -- see the removed-button note in renderAuthCard(). Apple
  // sign-in and passkey enrollment are further-out fast-follows (Apple needs an Apple
  // Developer Program membership; passkeys enroll from an authenticated session, so that
  // belongs in Settings).
  let authMode = 'signin'; // 'signin' | 'signup' | 'forgot'
  let appStarted = false;
  // Set right before a user-initiated signOut() call so the SIGNED_OUT handler below can tell
  // that apart from an involuntary session expiry (revoked/expired refresh token) -- both fire
  // the same event, but only the latter should show "Your session expired" messaging.
  let explicitSignOut = false;

  function showApp(){
    if(appStarted) return;
    appStarted = true;
    // Keep the auth gate up (with a loading state in its card) until the household's data
    // has actually loaded — reveals #hub only once there's something real to show, instead
    // of flashing its empty shell while the fetch is in flight.
    const card = document.getElementById('authCard');
    card.innerHTML = '';
    const stopLoading = showLoadingIndicator(card, 'Loading your household…');
    init(stopLoading);
  }

  // Both an expired/used password-reset link AND a cancelled Google consent screen redirect
  // back here with #error=...&error_description=... in the URL hash rather than firing a
  // normal Supabase auth event -- without this check either would silently fall through to an
  // ordinary sign-in form with no explanation of what just happened. Branches on error_code
  // since the two cases need different copy (one's a dead link, the other's just a change of
  // mind) even though Supabase reports both the same shape.
  function checkAuthLinkError(){
    const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
    const params = new URLSearchParams(hash);
    const description = params.get('error_description');
    const errorCode = params.get('error_code') || params.get('error') || '';
    if(!description) return false;
    history.replaceState(null, '', location.pathname);
    const card = document.getElementById('authCard');
    const isCancelled = errorCode === 'access_denied';
    card.innerHTML = isCancelled
      ? `<h2>Sign-in was cancelled</h2>
         <div class="section-sub">No changes were made — try again whenever you're ready.</div>
         <button class="primary-btn" id="authLinkErrorBackBtn">Back to sign in</button>`
      : `<h2>Something went wrong</h2>
         <div class="section-sub">${description.replace(/\+/g, ' ')}</div>
         <button class="primary-btn" id="authLinkErrorRetryBtn">Request a new link</button>
         <div class="auth-switch-row"><button class="auth-link-btn" id="authLinkErrorBackBtn">Back to sign in</button></div>`;
    card.querySelector('#authLinkErrorRetryBtn')?.addEventListener('click', ()=>{ authMode = 'forgot'; renderAuthCard(); });
    card.querySelector('#authLinkErrorBackBtn').addEventListener('click', ()=>{ authMode = 'signin'; renderAuthCard(); });
    return true;
  }

  function showAuthGate(message){
    appStarted = false;
    document.body.classList.add('auth-pending');
    // A stale onboarding overlay (z-index 60) is currently only ever masked by #authGate's
    // higher z-index (100), not actually removed -- endOnboardingSkipped() cleans up after
    // itself, but a sign-out or session expiry mid-onboarding previously didn't. Left alone, it
    // would render on top of #hub (no explicit z-index, so effectively 0) the next time this
    // tab reaches the ready app-shell state without an intervening full page reload.
    onboardingOverlayEl()?.remove();
    authMode = 'signin';
    if(checkAuthLinkError()) return;
    renderAuthCard(message);
  }

  function renderAuthCard(message){
    const card = document.getElementById('authCard');

    if(authMode === 'forgot'){
      card.innerHTML = `
        <h2>Reset your password</h2>
        <div class="section-sub">Enter your email and we will send a reset link.</div>
        <input type="email" id="authForgotEmail" class="text-input" placeholder="Email" autocomplete="email">
        <div class="auth-status-note" id="authStatusNote"></div>
        <button class="primary-btn" id="authForgotBtn">Send reset link</button>
        <div class="auth-switch-row"><button class="auth-link-btn" id="authBackBtn">Back to sign in</button></div>`;
      card.querySelector('#authBackBtn').addEventListener('click', ()=>{ authMode = 'signin'; renderAuthCard(); });
      card.querySelector('#authForgotBtn').addEventListener('click', async ()=>{
        const email = card.querySelector('#authForgotEmail').value.trim();
        const note = card.querySelector('#authStatusNote');
        if(!email){ note.textContent = 'Enter your email first'; note.classList.remove('ok'); return; }
        const btn = card.querySelector('#authForgotBtn');
        btn.disabled = true; note.textContent = 'Sending…'; note.classList.remove('ok');
        try{
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
          if(error) throw error;
          note.textContent = 'Check your email for a reset link.'; note.classList.add('ok');
        }catch(e){
          note.textContent = e.message || 'Could not send reset link.'; note.classList.remove('ok');
          btn.disabled = false;
        }
      });
      return;
    }

    const isSignup = authMode === 'signup';
    card.innerHTML = `
      <h2>${isSignup ? 'Create your household account' : 'Sign in'}</h2>
      <div class="section-sub">${isSignup ? 'One shared login for your whole household.' : 'Welcome back.'}</div>
      <input type="email" id="authEmail" class="text-input" placeholder="Email" autocomplete="email">
      <input type="password" id="authPassword" class="text-input" placeholder="Password" autocomplete="${isSignup ? 'new-password' : 'current-password'}">
      ${isSignup ? '' : '<div class="auth-forgot-row"><button class="auth-link-btn" id="authForgotLink">Forgot password?</button></div>'}
      <div class="auth-status-note" id="authStatusNote"></div>
      <button class="primary-btn" id="authSubmitBtn">${isSignup ? 'Create account' : 'Sign in'}</button>
      <div class="auth-switch-row">
        ${isSignup ? 'Already have an account? ' : 'New household? '}
        <button class="auth-link-btn" id="authSwitchBtn">${isSignup ? 'Sign in' : 'Create one'}</button>
      </div>`;
    if(message) card.querySelector('#authStatusNote').textContent = message;
    // Google sign-in button removed: no OAuth client configured in Supabase (provider disabled,
    // Client ID/Secret empty) as of 2026-08-15. Re-add once a real Google Cloud OAuth client
    // exists and the provider is enabled -- checkAuthLinkError() below still handles the
    // post-redirect OAuth-cancellation/error case for whenever it comes back.

    if(!isSignup){
      card.querySelector('#authForgotLink').addEventListener('click', ()=>{ authMode = 'forgot'; renderAuthCard(); });
    }
    card.querySelector('#authSwitchBtn').addEventListener('click', ()=>{ authMode = isSignup ? 'signin' : 'signup'; renderAuthCard(); });
    card.querySelector('#authSubmitBtn').addEventListener('click', async ()=>{
      const email = card.querySelector('#authEmail').value.trim();
      const password = card.querySelector('#authPassword').value;
      const note = card.querySelector('#authStatusNote');
      const btn = card.querySelector('#authSubmitBtn');
      if(!email || !password){ note.textContent = 'Enter an email and password'; note.classList.remove('ok'); return; }
      if(isSignup){
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ note.textContent = 'Enter a valid email address'; note.classList.remove('ok'); return; }
        if(password.length < 6){ note.textContent = 'Password must be at least 6 characters'; note.classList.remove('ok'); return; }
      }
      btn.disabled = true; note.textContent = isSignup ? 'Creating account…' : 'Signing in…'; note.classList.remove('ok');
      try{
        // Email confirmation is off for this project (see Task #17's Section A decision) --
        // signUp() returns an immediately-authenticated session, same as signIn. There is no
        // separate "check your email" state to show; onAuthStateChange's SIGNED_IN handler
        // takes over from here either way, routing a brand-new account into onboarding.
        const { error } = isSignup
          ? await supabaseClient.auth.signUp({ email, password })
          : await supabaseClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }catch(e){
        // Supabase's duplicate-signup error text varies by version ("User already registered",
        // "already been registered", etc.) -- match loosely rather than a single exact string.
        if(isSignup && /already|registered|exists/i.test(e.message || '')){
          note.innerHTML = `An account with this email already exists. <button class="auth-link-btn" id="authGoToSigninBtn">Sign in</button> instead, or use Forgot password if needed.`;
          note.classList.remove('ok');
          card.querySelector('#authGoToSigninBtn')?.addEventListener('click', ()=>{ authMode = 'signin'; renderAuthCard(); });
        } else {
          note.textContent = e.message || 'Something went wrong.'; note.classList.remove('ok');
        }
        btn.disabled = false;
      }
    });
  }

  function renderResetPasswordForm(){
    const card = document.getElementById('authCard');
    card.innerHTML = `
      <h2>Set a new password</h2>
      <div class="section-sub">Choose a new password for your account.</div>
      <input type="password" id="authNewPassword" class="text-input" placeholder="New password" autocomplete="new-password">
      <div class="auth-status-note" id="authStatusNote"></div>
      <button class="primary-btn" id="authSetPasswordBtn">Set password</button>`;
    card.querySelector('#authSetPasswordBtn').addEventListener('click', async ()=>{
      const password = card.querySelector('#authNewPassword').value;
      const note = card.querySelector('#authStatusNote');
      const btn = card.querySelector('#authSetPasswordBtn');
      if(!password || password.length < 6){ note.textContent = 'Password must be at least 6 characters'; note.classList.remove('ok'); return; }
      btn.disabled = true; note.textContent = 'Saving…'; note.classList.remove('ok');
      try{
        const { error } = await supabaseClient.auth.updateUser({ password });
        if(error) throw error;
        note.textContent = 'Password updated — signing you in…'; note.classList.add('ok');
        setTimeout(showApp, 800);
      }catch(e){
        note.textContent = e.message || 'Could not update password.'; note.classList.remove('ok');
        btn.disabled = false;
      }
    });
  }

  // ---------------- Onboarding ----------------
  // Guided first-run flow for a signed-in user with no households row, or with a row that
  // exists but hasn't finished onboarding (households.onboarding_completed_at still null —
  // see loadHouseholdData()/init() above). Rendered as a full-viewport overlay appended
  // directly to <body> (not #hub, which stays behind body.auth-pending's display:none while
  // this runs) — same .overlay-page pattern Settings/meal-history already use, just anchored
  // one level higher since #hub itself has nothing loaded into it yet at this point.
  //
  // Exact standard board-of-advisors set, read directly from the real household's existing
  // rows (not reinvented) — 3 fixed personas, 2 is_customizable (matches Settings' own copy,
  // which never surfaces customization in onboarding per the PRD's deliberate P0 scope cut).
  const ADVISOR_SEED = [
    { persona_key: 'weeknight_realist', name: 'The Weeknight Realist', philosophy: 'Fast, low-fuss, high repeat-rate family recipes; minimal cleanup and pantry staples.', is_customizable: false },
    { persona_key: 'flavor_explorer', name: 'The Flavor Explorer', philosophy: 'Bold, unfussy, global flavors; uses whole ingredients; gentle, low-stakes variety.', is_customizable: true },
    { persona_key: 'veg_forward_stylist', name: 'The Veg-Forward Stylist', philosophy: 'Vegetable-forward, herb- and spice-driven; makes vegetables genuinely kid-appealing.', is_customizable: true },
    { persona_key: 'child_nutritionist', name: 'The Child Nutritionist', philosophy: 'Realistic picky-eating strategy: repeated low-pressure exposure, pairing new with familiar, no bribery or battles.', is_customizable: false },
    { persona_key: 'family_gp', name: 'The Family GP / Dietician', philosophy: 'Whole-week balance check: protein variety, iron/fibre, flags anything relevant to health notes.', is_customizable: false },
  ];

  let onboardingUserId = null;       // set when starting fresh (no households row yet)
  let onboardingHousehold = null;    // in-memory working copy being built across screens 1-3
  let onboardingMealsAdded = 0;      // session count for screen 3's running list
  let onboardingPreviewDismissed = false;

  function onboardingOverlayEl(){ return document.getElementById('onboardingOverlay'); }

  async function startOnboarding(household){
    if(household && household.adults >= 1){
      // Resuming with the required fields already satisfied — per the PRD's resumability rule,
      // the only remaining incomplete screen is meal history. Checking adults specifically
      // (not just "does a households row exist") matters because a household row can now also
      // exist from a Screen-1 skip, which upserts a bare row without ever validating adults —
      // that case must still resume at Screen 2, not skip straight past its required fields.
      currentHouseholdId = household.id;
      onboardingHousehold = household;
      renderOnboardingScreen('mealhistory');
    } else {
      if(household){
        currentHouseholdId = household.id;
        onboardingUserId = household.id;
        onboardingHousehold = household;
      } else {
        const { data: { user } } = await supabaseClient.auth.getUser();
        onboardingUserId = user.id;
        onboardingHousehold = {
          adults: 0, kids: 0, allergies_or_restrictions: '', likes: '', dislikes: '',
          pantry_staples: '', use_up_this_week: '', key_principles: []
        };
      }
      renderOnboardingScreen('welcome');
    }
  }

  function renderOnboardingScreen(screen){
    document.body.classList.remove('auth-pending');
    let overlay = onboardingOverlayEl();
    if(!overlay){
      overlay = document.createElement('div');
      overlay.className = 'overlay-page';
      overlay.id = 'onboardingOverlay';
      document.body.appendChild(overlay);
    }
    if(screen === 'welcome') renderOnboardingWelcome(overlay);
    else if(screen === 'household') renderOnboardingHousehold(overlay);
    else if(screen === 'mealhistory') renderOnboardingMealHistory(overlay);
    else if(screen === 'completion') renderOnboardingCompletion(overlay);
  }

  // Screens 1-2's "Skip for now": ends onboarding immediately, no automatic Completion work,
  // onboarding_completed_at stays null. Deliberately does NOT just re-run init() — that would
  // hit the exact same onboarding_completed_at gate that just sent them here and bounce them
  // straight back into onboarding, defeating the point of skipping. Instead this enters the app
  // shell directly for *this* visit (loadHouseholdData's ignoreOnboardingGate), while leaving
  // onboarding_completed_at null so a genuinely fresh future load still resumes onboarding
  // (Screens 1-2 are only ever reachable pre-household-row, so there's no risk of this upsert
  // clobbering real saved data — see startOnboarding()).
  async function endOnboardingSkipped(){
    onboardingOverlayEl()?.remove();
    const uid = onboardingUserId || currentHouseholdId;
    const h = onboardingHousehold;
    try{
      await supabaseClient.from('households').upsert({
        id: uid, adults: h.adults, kids: h.kids,
        allergies_or_restrictions: h.allergies_or_restrictions, likes: h.likes, dislikes: h.dislikes,
        pantry_staples: h.pantry_staples, use_up_this_week: h.use_up_this_week, key_principles: h.key_principles
      });
    }catch(e){ /* fall through — loadHouseholdData below will surface the real error if this household row still can't be read */ }
    currentHouseholdId = uid;

    document.body.classList.remove('auth-pending');
    const stopLoading = showLoadingIndicator(document.getElementById('authCard'), 'Loading your household…');
    let result;
    try{
      result = await loadHouseholdData({ ignoreOnboardingGate: true });
    }catch(e){
      stopLoading();
      document.body.classList.add('auth-pending');
      document.getElementById("authCard").innerHTML = `<div class="no-recipe">Couldn't load your household data — try reloading the page.</div>`;
      return;
    }
    await renderAppShellReady(stopLoading);
  }

  function renderOnboardingWelcome(overlay){
    overlay.innerHTML = `
      <div class="overlay-inner">
        <div class="onboarding-center">
          <div class="onboarding-icon">🍽️</div>
          <h2 class="overlay-title">Let's build your family's meal plan</h2>
          <p class="overlay-sub">Tell us a bit about your household and we'll get smarter with every detail you add — the more we know, the better tonight's suggestion gets.</p>
        </div>
        <div class="onboarding-pitch-row">
          <div class="onboarding-pitch-item"><span class="icon">🥗</span>Household prefs shape every plan</div>
          <div class="onboarding-pitch-item"><span class="icon">📝</span>Past meals teach us what works</div>
          <div class="onboarding-pitch-item"><span class="icon">✨</span>Watch your plan improve live</div>
        </div>
        <button class="primary-btn" id="obGetStartedBtn">Get started</button>
        <button class="cancel-link" id="obSkipBtn">Skip for now</button>
      </div>`;
    overlay.querySelector('#obGetStartedBtn').addEventListener('click', ()=> renderOnboardingScreen('household'));
    overlay.querySelector('#obSkipBtn').addEventListener('click', endOnboardingSkipped);
  }

  // Shared live-preview panel for screens 2 & 3. Deliberately NOT a fabricated sample dish —
  // an actual generated dinner isn't available until Completion's real AI call, so making one
  // up here would show something that might not match what's actually generated. Instead this
  // echoes back, honestly, what was just entered — still the "tangible, not just stated" proof
  // of value the PRD asks for, without a per-keystroke AI call (slow, costs real API spend).
  function onboardingPreviewLines(){
    const h = onboardingHousehold;
    const lines = [];
    const people = [];
    if(h.adults) people.push(`${h.adults} adult${h.adults === 1 ? '' : 's'}`);
    if(h.kids) people.push(`${h.kids} kid${h.kids === 1 ? '' : 's'}`);
    lines.push(`Feeds <b>${people.length ? people.join(' + ') : 'your household'}</b>`);
    if(h.allergies_or_restrictions) lines.push(`Works around: <b>${h.allergies_or_restrictions}</b>`);
    if(h.dislikes) lines.push(`Skips: <b>${h.dislikes}</b>`);
    if(h.likes) lines.push(`Leans into: <b>${h.likes}</b>`);
    if(h.pantry_staples) lines.push(`Uses what's on hand: <b>${h.pantry_staples}</b>`);
    if((h.key_principles || []).length) lines.push(`Following <b>${h.key_principles.length} principle${h.key_principles.length === 1 ? '' : 's'}</b> you've set`);
    if(onboardingMealsAdded > 0) lines.push(`Learning from <b>${onboardingMealsAdded} meal${onboardingMealsAdded === 1 ? '' : 's'}</b> you've told us about`);
    if(lines.length <= 1 && !h.allergies_or_restrictions && !h.dislikes && !h.likes && !h.pantry_staples && !(h.key_principles||[]).length && !onboardingMealsAdded){
      return `<div class="onboarding-preview-line">Add a few details below and we'll start tailoring your plan.</div>`;
    }
    return lines.map(l => `<div class="onboarding-preview-line">${l}</div>`).join('');
  }

  function renderOnboardingPreviewCard(){
    if(onboardingPreviewDismissed) return '';
    return `
      <div class="onboarding-preview-card" id="obPreviewCard">
        <button class="onboarding-preview-close" id="obPreviewClose" aria-label="Dismiss preview" type="button">✕</button>
        <div class="onboarding-preview-eyebrow">✨ What we'll use for your plan</div>
        <div id="obPreviewBody">${onboardingPreviewLines()}</div>
      </div>`;
  }

  function pulseOnboardingPreview(){
    const card = document.getElementById('obPreviewCard');
    if(!card) return;
    const body = document.getElementById('obPreviewBody');
    card.classList.add('pulse');
    body.innerHTML = onboardingPreviewLines();
    setTimeout(()=> card.classList.remove('pulse'), 900);
  }

  function bindOnboardingPreviewClose(overlay){
    const closeBtn = overlay.querySelector('#obPreviewClose');
    if(!closeBtn) return;
    closeBtn.addEventListener('click', ()=>{
      onboardingPreviewDismissed = true;
      document.getElementById('obPreviewCard')?.remove();
    });
  }

  function renderOnboardingHousehold(overlay){
    const h = onboardingHousehold;
    const checksHtml = DEFAULT_PRINCIPLES.map(p => `
      <label class="item">
        <input type="checkbox" data-ob-principle-id="${p.id}" ${p.checked ? 'checked' : ''}>
        <span>${p.label}</span>
      </label>`).join('');

    overlay.innerHTML = `
      <div class="overlay-inner">
        <button class="overlay-close" id="obBackBtn"><i class="ti ti-arrow-left"></i>Back</button>
        <div class="overlay-title">Your household</div>
        <div class="overlay-sub">Just the headcount is required — everything below is optional, but the more you add, the better your plan gets.</div>

        ${renderOnboardingPreviewCard()}

        <div class="principles-card" style="margin-bottom:14px;">
          <div class="onboarding-section-label">Who's in your household? <span class="onboarding-tag required">Required</span></div>
          <div style="margin-top:10px;">
            <div class="stepper-row">
              <span class="stepper-label">Adults</span>
              <div class="stepper-control">
                <button class="stepper-btn" type="button" data-ob-stepper="adults" data-delta="-1" ${h.adults <= 0 ? 'disabled' : ''}>&minus;</button>
                <span class="stepper-value" id="obAdultsValue">${h.adults}</span>
                <button class="stepper-btn" type="button" data-ob-stepper="adults" data-delta="1">+</button>
              </div>
            </div>
            <div class="stepper-row">
              <span class="stepper-label">Kids</span>
              <div class="stepper-control">
                <button class="stepper-btn" type="button" data-ob-stepper="kids" data-delta="-1" ${h.kids <= 0 ? 'disabled' : ''}>&minus;</button>
                <span class="stepper-value" id="obKidsValue">${h.kids}</span>
                <button class="stepper-btn" type="button" data-ob-stepper="kids" data-delta="1">+</button>
              </div>
            </div>
          </div>
          <div class="onboarding-error-note" id="obHouseholdError"></div>
        </div>

        <div class="principles-card" style="margin-bottom:14px;">
          <div class="onboarding-section-label">A few more details <span class="onboarding-tag optional">Optional</span></div>
          <div class="onboarding-hint">Open by default — nothing here blocks you from continuing.</div>
          <div class="onboarding-field-grid">
            <div>
              <label class="modal-label">Allergies / restrictions</label>
              <input class="text-input" id="obAllergies" placeholder="e.g. dairy-light" value="${h.allergies_or_restrictions}">
            </div>
            <div>
              <label class="modal-label">Dislikes</label>
              <input class="text-input" id="obDislikes" placeholder="e.g. tomatoes" value="${h.dislikes}">
            </div>
            <div>
              <label class="modal-label">Likes</label>
              <input class="text-input" id="obLikes" placeholder="e.g. tacos, stir-fry" value="${h.likes}">
            </div>
            <div>
              <label class="modal-label">Pantry staples</label>
              <input class="text-input" id="obPantry" placeholder="e.g. rice, canned beans" value="${h.pantry_staples}">
            </div>
            <div class="full">
              <label class="modal-label">Use up this week</label>
              <input class="text-input" id="obUseUp" placeholder="e.g. half a bag of spinach" value="${h.use_up_this_week}">
            </div>
          </div>
        </div>

        <div class="principles-card" style="margin-bottom:14px;">
          <div class="onboarding-section-label">Meal-planning principles <span class="onboarding-tag optional">Optional</span></div>
          <div class="onboarding-hint">Same component as Settings → Meal Planning Principles — reused here as-is.</div>
          <div class="principles-defaults-list">${checksHtml}</div>
          <div class="modal-label" style="margin-top:10px;">Anything else?</div>
          <textarea id="obPrinciplesFreeText" rows="3" placeholder="e.g. one kid is picky about texture, favor mild spice"></textarea>
        </div>

        <button class="primary-btn" id="obSaveContinueBtn">Save &amp; continue</button>
        <button class="cancel-link" id="obSkipBtn">Skip for now</button>
      </div>`;

    overlay.querySelector('#obBackBtn').addEventListener('click', ()=> renderOnboardingScreen('welcome'));
    overlay.querySelector('#obSkipBtn').addEventListener('click', endOnboardingSkipped);
    bindOnboardingPreviewClose(overlay);

    overlay.querySelectorAll('[data-ob-stepper]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const field = btn.dataset.obStepper;
        const delta = parseInt(btn.dataset.delta, 10);
        h[field] = Math.max(0, h[field] + delta);
        renderOnboardingHousehold(overlay);
      });
    });

    overlay.querySelector('#obSaveContinueBtn').addEventListener('click', async ()=>{
      const err = overlay.querySelector('#obHouseholdError');
      if(h.adults < 1){
        err.textContent = "Let us know how many adults are in your household.";
        return;
      }
      err.textContent = '';

      h.allergies_or_restrictions = overlay.querySelector('#obAllergies').value.trim();
      h.dislikes = overlay.querySelector('#obDislikes').value.trim();
      h.likes = overlay.querySelector('#obLikes').value.trim();
      h.pantry_staples = overlay.querySelector('#obPantry').value.trim();
      h.use_up_this_week = overlay.querySelector('#obUseUp').value.trim();

      const principleLines = [];
      overlay.querySelectorAll('[data-ob-principle-id]').forEach(cb=>{
        if(cb.checked){
          const preset = DEFAULT_PRINCIPLES.find(p => p.id === cb.dataset.obPrincipleId);
          if(preset) principleLines.push(preset.text);
        }
      });
      overlay.querySelector('#obPrinciplesFreeText').value.trim().split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
        principleLines.push(l.replace(/^-\s*/, ''));
      });
      h.key_principles = principleLines;

      const btn = overlay.querySelector('#obSaveContinueBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try{
        // Household row may not exist yet (brand-new signup) or may already exist (resuming
        // after a skip) -- upsert covers both without a separate insert-vs-update branch.
        // Deliberately does NOT insert a principles_update feedback row the way Settings'
        // save handler does: that row exists to tell regenerate-now "something changed since
        // the last plan," but there is no plan yet at this point in onboarding -- Completion's
        // fresh generation reads household.key_principles directly.
        const { error } = await supabaseClient.from('households').upsert({
          id: onboardingUserId || currentHouseholdId,
          adults: h.adults, kids: h.kids,
          allergies_or_restrictions: h.allergies_or_restrictions,
          likes: h.likes, dislikes: h.dislikes,
          pantry_staples: h.pantry_staples, use_up_this_week: h.use_up_this_week,
          key_principles: h.key_principles
        });
        if(error) throw error;
        currentHouseholdId = onboardingUserId || currentHouseholdId;
        pulseOnboardingPreview();
        setTimeout(()=> renderOnboardingScreen('mealhistory'), 500);
      }catch(e){
        err.textContent = "Couldn't save: " + (e.message || 'unknown error');
        btn.disabled = false; btn.textContent = 'Save & continue';
      }
    });
  }

  let onboardingMealChips = [];

  // Screen 3 has no required fields left to gather (adults/kids/etc. were already saved on
  // Screen 2), so "Skip for now" and "Finish" are the same action here -- both proceed to
  // Completion with whatever meals (zero or more) were added. This differs from Screens 1-2,
  // where skip truly abandons onboarding, because there's nothing left to abandon by this point.
  function renderOnboardingMealHistory(overlay){
    overlay.innerHTML = `
      <div class="overlay-inner">
        <button class="overlay-close" id="obBackBtn"><i class="ti ti-arrow-left"></i>Back</button>
        <div class="overlay-title">Add a few recent meals</div>
        <div class="overlay-sub">Add a couple of recent meals to get started — including ones from before this app. You can always add more later.</div>
        ${renderOnboardingPreviewCard()}
        <div id="obMealChips">${onboardingMealChips.map(d => `<div class="onboarding-meal-chip"><span class="dot"></span>${d}</div>`).join('')}</div>
        <div id="obMealFormContainer"></div>
        <button class="primary-btn" id="obFinishBtn">Finish</button>
        <button class="cancel-link" id="obSkipBtn">Skip for now</button>
      </div>`;

    overlay.querySelector('#obBackBtn').addEventListener('click', ()=> renderOnboardingScreen('household'));
    bindOnboardingPreviewClose(overlay);

    renderMealHistoryFormInto(overlay.querySelector('#obMealFormContainer'), (desc)=>{
      onboardingMealsAdded++;
      onboardingMealChips.push(desc);
      overlay.querySelector('#obMealChips').insertAdjacentHTML('beforeend', `<div class="onboarding-meal-chip"><span class="dot"></span>${desc}</div>`);
      pulseOnboardingPreview();
    });

    overlay.querySelector('#obFinishBtn').addEventListener('click', ()=> renderOnboardingScreen('completion'));
    overlay.querySelector('#obSkipBtn').addEventListener('click', ()=> renderOnboardingScreen('completion'));
  }

  // Fully automatic: no user input happens on this screen. Order matters -- advisors are
  // seeded before generation runs, since the generation prompt reads board_of_advisors to
  // credit dinners to a persona; an empty advisors table at generation time would produce
  // dinners with no attribution. onboarding_completed_at is only set once both steps have
  // actually succeeded, never optimistically.
  async function renderOnboardingCompletion(overlay){
    overlay.innerHTML = `
      <div class="overlay-inner">
        <div class="onboarding-center" id="obCompletionLoading"></div>
      </div>`;
    const stopLoading = showLoadingIndicator(overlay.querySelector('#obCompletionLoading'), 'Setting up your board and your first plan…');

    try{
      // Idempotent: a retry after a failed generation shouldn't re-seed or duplicate advisors.
      const { data: existingAdvisors, error: advCheckErr } = await supabaseClient
        .from('board_of_advisors').select('persona_key').eq('household_id', currentHouseholdId);
      if(advCheckErr) throw advCheckErr;
      if(!existingAdvisors || existingAdvisors.length === 0){
        const { error: advErr } = await supabaseClient.from('board_of_advisors')
          .insert(ADVISOR_SEED.map(a => ({ ...a, household_id: currentHouseholdId })));
        if(advErr) throw advErr;
      }

      // The user-JWT branch of propose-week (see supabase/functions/propose-week) -- same
      // generation logic and force-override bypass pg_cron uses, scoped to this caller's own
      // household only, never gated on Saturday since onboarding always wants it immediately.
      const genResult = await callEdgeFunction('propose-week', {});
      const householdResult = genResult && genResult.results && genResult.results[0];
      if(!householdResult || householdResult.status !== 'ok'){
        throw new Error((householdResult && householdResult.message) || genResult.message || "Couldn't generate your first plan — try again.");
      }

      const { error: completeErr } = await supabaseClient.from('households')
        .update({ onboarding_completed_at: new Date().toISOString() }).eq('id', currentHouseholdId);
      if(completeErr) throw completeErr;

      stopLoading();
      renderOnboardingCompletionSuccess(overlay);
    }catch(e){
      stopLoading();
      renderOnboardingCompletionError(overlay, e.message || 'Something went wrong finishing setup.');
    }
  }

  function renderOnboardingCompletionSuccess(overlay){
    const h = onboardingHousehold;
    overlay.innerHTML = `
      <div class="overlay-inner">
        <div class="onboarding-center">
          <div class="onboarding-done-icon"><i class="ti ti-check"></i></div>
          <h2 class="overlay-title">You're all set!</h2>
          <p class="overlay-sub">We've seeded your board of advisors and generated This Week's plan using what you told us.</p>
        </div>
        <div class="principles-card">
          <div class="onboarding-summary-line"><span class="dot"></span>Household saved (${h.adults} adult${h.adults === 1 ? '' : 's'}, ${h.kids} kid${h.kids === 1 ? '' : 's'})</div>
          <div class="onboarding-summary-line"><span class="dot"></span>${onboardingMealsAdded} recent meal${onboardingMealsAdded === 1 ? '' : 's'} added</div>
          <div class="onboarding-summary-line"><span class="dot"></span>5 board-of-advisors personas seeded</div>
          <div class="onboarding-summary-line"><span class="dot"></span>This week's plan personalized</div>
        </div>
        <button class="primary-btn" id="obSeePlanBtn">See my plan</button>
      </div>`;
    // A full reload, not a call back into the existing in-memory app state -- this is the same
    // class of transition as the account-switch staleness bug found during regression testing
    // (stale PRINCIPLES_TEXT surviving an auth switch until a real reload). Cheapest guarantee
    // that nothing pre-onboarding survives: reinitialize the whole page from scratch.
    overlay.querySelector('#obSeePlanBtn').addEventListener('click', ()=> location.reload());
  }

  function renderOnboardingCompletionError(overlay, message){
    overlay.innerHTML = `
      <div class="overlay-inner">
        <div class="onboarding-center">
          <div class="onboarding-icon">⚠️</div>
          <h2 class="overlay-title">Couldn't finish setup</h2>
          <p class="overlay-sub">${message}</p>
        </div>
        <button class="primary-btn" id="obRetryBtn">Try again</button>
      </div>`;
    overlay.querySelector('#obRetryBtn').addEventListener('click', ()=> renderOnboardingScreen('completion'));
  }

  // null = not yet determined (only true on the very first callback). Guards against
  // a redundant "still signed out" event re-rendering the auth card out from under a
  // signup/forgot-password interaction the user is already mid-way through.
  let knownSignedIn = null;

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(event === 'PASSWORD_RECOVERY'){
      document.body.classList.add('auth-pending');
      renderResetPasswordForm();
      return;
    }
    if(session){
      knownSignedIn = true;
      showApp();
    } else if(knownSignedIn !== false){
      // A prior true (not the initial null) means the app was actually up and running under a
      // session that just vanished -- an involuntary expiry, unless the user just clicked
      // "Sign out" themselves (explicitSignOut). A null->false transition is just "never signed
      // in on this load," which needs no explanation.
      const sessionExpired = knownSignedIn === true && !explicitSignOut;
      knownSignedIn = false;
      explicitSignOut = false;
      showAuthGate(sessionExpired ? 'Your session expired, please sign in again' : undefined);
    }
  });
})();
</script>
</body>
</html>
