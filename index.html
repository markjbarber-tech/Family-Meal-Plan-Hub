<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Menu — Family Menu Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF5EC;
    --ink:#2E2A22;
    --sage:#54634C;
    --sage-dark:#3B4636;
    --ochre:#C08A2E;
    --line:#E4DAC6;
    --card:#FFFFFF;
    --no:#B5524B;
    --mostly:#C08A2E;
    --yes:#54634C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);}
  #hub{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--paper);
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 40px;
    min-height:100vh;
  }
  #hub h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:4px 0 2px;
    letter-spacing:-0.01em;
  }
  #hub .subtitle{
    font-size:13px;
    color:var(--sage-dark);
    margin-bottom:18px;
    opacity:0.85;
  }
  #hub .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  #hub .tab{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 13px;
    border-radius:20px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--sage-dark);
    cursor:pointer;
  }
  #hub .tab.active{
    background:var(--sage);
    border-color:var(--sage);
    color:#fff;
  }
  #hub .panel{display:none;}
  #hub .panel.active{display:block;}
  #hub .day-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  #hub .day-title{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin-bottom:10px;
    color:var(--sage-dark);
  }
  #hub .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:8px 0;
    border-top:1px solid var(--line);
    gap:10px;
  }
  #hub .meal-row:first-of-type{border-top:none;}
  #hub .meal-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ochre);
    font-weight:700;
    width:56px;
    flex:0 0 56px;
    padding-top:2px;
  }
  #hub .meal-name{font-size:14.5px;font-weight:500;flex:1;}
  #hub .badge-new{
    font-size:10px;
    background:var(--ochre);
    color:#fff;
    padding:2px 6px;
    border-radius:8px;
    margin-left:6px;
    vertical-align:middle;
  }
  #hub .feedback-btn{
    font-size:12px;
    font-weight:600;
    color:var(--sage);
    background:#F1EEE3;
    border:none;
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  #hub .feedback-btn.logged{background:var(--sage);color:#fff;}
  #hub .section-title{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    margin:18px 0 8px;
    color:var(--sage-dark);
  }
  #hub .shop-section{margin-bottom:10px;}
  #hub .shop-cat{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ochre);
    font-weight:700;
    margin:10px 0 4px;
  }
  #hub .shop-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
    font-size:14px;
  }
  #hub .shop-item input{width:16px;height:16px;accent-color:var(--sage);}
  #hub .shop-item.checked span{text-decoration:line-through;opacity:0.5;}
  #hub .modal-backdrop{
    position:fixed;inset:0;background:rgba(46,42,34,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  #hub .modal{
    background:var(--card);
    width:100%;max-width:480px;
    border-radius:18px 18px 0 0;
    padding:20px;
  }
  #hub .modal h3{font-family:'Fraunces',serif;margin:0 0 4px;font-size:18px;}
  #hub .modal .meal-sub{font-size:13px;color:var(--sage-dark);margin-bottom:16px;}
  #hub .btn-row{display:flex;gap:8px;margin-bottom:16px;}
  #hub .choice-btn{
    flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  #hub .choice-btn.sel-yes{background:var(--yes);border-color:var(--yes);color:#fff;}
  #hub .choice-btn.sel-mostly{background:var(--mostly);border-color:var(--mostly);color:#fff;}
  #hub .choice-btn.sel-no{background:var(--no);border-color:var(--no);color:#fff;}
  #hub .stars{display:flex;gap:6px;margin-bottom:16px;}
  #hub .star{font-size:26px;cursor:pointer;color:var(--line);}
  #hub .star.on{color:var(--ochre);}
  #hub textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px;font-family:inherit;font-size:13px;resize:none;margin-bottom:14px;
  }
  #hub .save-btn{
    width:100%;background:var(--sage-dark);color:#fff;border:none;
    border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;
  }
  #hub .cancel-link{
    display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--sage-dark);opacity:0.7;
  }
  #hub .status-pill{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:#F1EEE3;color:var(--sage-dark);margin-bottom:14px;
  }
  #hub .recipe-link-btn{
    font-size:11px;font-weight:700;color:var(--sage);background:none;border:none;
    text-decoration:underline;cursor:pointer;padding:0;margin-left:4px;
  }
  #hub .recipe-page{
    position:fixed;inset:0;background:var(--paper);z-index:60;overflow-y:auto;
  }
  #hub .recipe-page-inner{
    max-width:480px;margin:0 auto;padding:20px 16px 40px;
  }
  #hub .recipe-close{
    font-size:13px;font-weight:600;color:var(--sage-dark);background:none;border:none;
    cursor:pointer;padding:0;margin-bottom:16px;
  }
  #hub .recipe-title{
    font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--ink);margin-bottom:4px;
  }
  #hub .recipe-author{
    font-size:12px;color:var(--ochre);font-weight:600;margin-bottom:18px;
  }
  #hub .recipe-section-h{
    font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--sage-dark);
    margin:18px 0 8px;
  }
  #hub .recipe-list{
    margin:0;padding-left:20px;font-size:14px;line-height:1.6;
  }
  #hub .recipe-list li{margin-bottom:6px;}
  #hub .recipe-method li{margin-bottom:10px;}
  #hub .principles-link{
    display:inline-block;font-size:12px;font-weight:600;color:var(--sage-dark);
    background:#F1EEE3;border:none;border-radius:20px;padding:5px 12px;cursor:pointer;
    margin-bottom:14px;margin-left:8px;
  }
  #hub .principles-page-inner textarea{
    width:100%;min-height:280px;font-size:13.5px;line-height:1.6;font-family:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:8px;resize:vertical;
  }
  #hub .principles-page-inner .principles-status-note{
    font-size:12px;color:var(--sage);font-weight:600;height:16px;margin-bottom:8px;
  }
  #hub .copy-shop-btn{
    width:100%;background:var(--sage);color:#fff;border:none;border-radius:10px;
    padding:11px;font-weight:700;font-size:13px;cursor:pointer;margin-top:16px;
  }
  #hub .copy-shop-btn.copied{background:var(--sage-dark);}
  #hub .review-box{
    background:var(--card);border:1.5px solid var(--ochre);border-radius:14px;
    padding:16px;margin-bottom:16px;
  }
  #hub .review-box .review-title{
    font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--sage-dark);margin-bottom:4px;
  }
  #hub .review-box .review-sub{font-size:12px;color:var(--ink);opacity:0.75;margin-bottom:14px;}
  #hub .review-box label{
    display:block;font-size:12px;font-weight:600;color:var(--sage-dark);margin-bottom:6px;
  }
  #hub .review-box textarea{
    width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;
    padding:10px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;margin-bottom:14px;
  }
  #hub .review-box .review-saved-note{font-size:12px;color:var(--sage);font-weight:600;height:16px;margin-bottom:4px;}
  #hub .dietary-note{
    font-size:12px;color:var(--sage-dark);background:#F1EEE3;border-radius:10px;padding:10px 12px;margin-bottom:14px;
  }
  #hub .footer-note{
    font-size:11px;color:var(--sage-dark);opacity:0.6;text-align:center;margin-top:24px;
  }
</style>
</head>
<body>

<div id="hub">
  <div class="status-pill" id="statusPill">loading…</div>
  <h1>This Week's Menu</h1>
  <div class="subtitle" id="dateRange">—</div>
  <button class="principles-link" id="principlesLinkBtn">📋 Meal planning principles</button>

  <div id="reviewBoxContainer"></div>

  <div class="tabs">
    <button class="tab active" data-panel="plan">Plan</button>
    <button class="tab" data-panel="shop">Shopping list</button>
  </div>

  <div class="panel active" id="panel-plan"></div>
  <div class="panel" id="panel-shop"></div>

  <div class="footer-note">Published by the Family Menu Planner · updated weekly</div>
</div>

<script>
(function(){
  // ---- Claude replaces WEEK_DATA, PRINCIPLES_TEXT, and (rarely) FEEDBACK_ENDPOINT each week ----
  const FEEDBACK_ENDPOINT = "https://script.google.com/macros/s/AKfycbwQXFwbeGLuhF8XA08NpEiWmCRscGNjxTt0wN3lGc73Pk-7PXLPMwU4dexHaRbQDRAWMw/exec";
  const FEEDBACK_EMAIL = "mark.j.barber@gmail.com";

  const WEEK_DATA = {
    week_id: "2026-W33",
    date_range: "Aug 10 – Aug 16, 2026",
    status: "proposed",
    days: [
      {day:"Monday", dinner:{name:"Soy-glazed baked chicken thighs, rice & steamed broccoli", new:true, authored_by:"The Weeknight Realist & The Child Nutritionist", recipe:{ingredients:["8 boneless, skinless chicken thighs","1/3 cup soy sauce","2 tbsp honey","1 tbsp rice vinegar (or lemon juice)","2 cloves garlic, minced","1 tsp grated ginger","1 tbsp cornstarch mixed with 2 tbsp water","1.5 cups jasmine rice","2 heads broccoli, cut into florets"], method:["Preheat oven to 200°C (400°F).","Whisk soy sauce, honey, rice vinegar, garlic and ginger in a small saucepan; simmer 2-3 min.","Stir in the cornstarch slurry and simmer until glossy and slightly thickened, about 1 min.","Lay chicken thighs in a baking dish, spoon over half the sauce, and bake 20 min.","Brush on the remaining sauce and bake a further 10 min until sticky and cooked through.","Meanwhile cook the rice according to packet directions, steaming the broccoli for the last 5-6 min.","Serve chicken over rice with broccoli alongside — a splash of extra plain soy sauce on the side for Hamish's rice if he wants it saucier."]}}, lunch:{name:"Cheese quesadillas", authored_by:"The Weeknight Realist", recipe:{ingredients:["4 flour tortillas","1.5 cups grated cheese (swap in a lactose-free block for Maddie's portion if you have it)","Butter for the pan"], method:["Scatter cheese over half of each tortilla, fold over.","Cook in a lightly buttered pan over medium heat, 2-3 min per side, until golden and the cheese is melted.","Cut into wedges to serve."]}}, snack:{name:"Apple slices with peanut butter"}},
      {day:"Tuesday", dinner:{name:"Build-your-own hard-shell tacos (Old El Paso), seasoned beef & toppings bar", new:true, authored_by:"The Weeknight Realist & The Child Nutritionist", recipe:{ingredients:["500g lean beef mince","1 packet Old El Paso taco seasoning","2 tbsp water","12 Old El Paso hard taco shells","1 cup grated cheese","1/2 cup sour cream","2 avocados, mashed","1 cup shredded lettuce","1/2 cup corn kernels, warmed","2 tomatoes, diced (optional topping — using up the tomatoes on hand)"], method:["Brown the beef mince in a dry pan over medium-high heat, breaking it up as it cooks, about 6-7 min.","Drain off any excess fat, then stir in the taco seasoning and water; simmer 2-3 min until it coats the meat — draining the fat keeps this lighter, which helps with Genevieve's indigestion.","Warm the taco shells according to packet directions.","Set out the beef, cheese, sour cream, mashed avocado, lettuce, warm corn and diced tomato separately and let everyone build their own.","Keep a tomato-free zone at one end of the board for Maddie's portion; everyone else can add the diced tomato — also helps use up spare tomatoes from the pantry."]}}, lunch:{name:"Soy chicken & rice wraps (Monday's leftovers)"}, snack:{name:"Banana"}},
      {day:"Wednesday", dinner:{name:"One-pan sausage & rice bake, with a tomato & cucumber side salad", new:true, authored_by:"The Weeknight Realist", recipe:{ingredients:["6 sausages, casings removed","1.5 cups long-grain rice","1 onion, diced","2 cloves garlic, minced","3 cups chicken stock","1 cup frozen peas","1/2 cup grated parmesan (adults' portion, served on the side)","2 tomatoes, sliced (using up the tomatoes on hand — adults' salad only)","1 cucumber, sliced","Olive oil & a pinch of salt for the salad"], method:["Brown sausage meat in a large oven-proof pan, breaking it into small pieces, about 6 min.","Drain off any excess fat before adding the onion and garlic, then cook until soft, 3 min — keeps this lighter for Genevieve.","Stir in rice, then pour in stock and bring to a simmer.","Cover and cook 15-18 min until rice is tender and the liquid is absorbed, stirring in the peas for the last 5 min.","While the bake cooks, toss the sliced tomato and half the cucumber with a little olive oil and salt for an adults' side salad.","Serve the bake as-is for the kids, with plain cucumber sticks (no tomato) alongside; pass parmesan separately for anyone who wants it — kept light on dairy for Maddie."]}}, lunch:{name:"Beef taco filling wraps (Tuesday's leftovers)"}, snack:{name:"Mandarins"}},
      {day:"Thursday", dinner:{name:"Egg & soy fried rice with bacon", new:false, authored_by:"The Flavor Explorer & The Weeknight Realist", recipe:{ingredients:["4 cups cold cooked rice (day-old if possible)","4 rashers bacon, diced","3 eggs, beaten","3 tbsp soy sauce","1 cup frozen peas and corn mix","2 spring onions, sliced","2 tbsp neutral oil"], method:["Heat oil in a large pan or wok over high heat; cook bacon until crisp, about 4 min.","Push bacon to one side, pour in the beaten egg and scramble until just set.","Add the rice, breaking up clumps, and stir-fry 3-4 min.","Add the peas and corn, soy sauce and spring onions; toss until heated through and everything is coated.","Serve as-is — a proven favourite for Hamish (rice with soy sauce, egg), easy to portion small for Maddie."]}}, lunch:{name:"Sausage rice bake (Wednesday's leftovers)"}, snack:{name:"Popcorn"}},
      {day:"Friday", dinner:{name:"Oven-tray chicken nuggets, wedges & corn (with a side salad for the grown-ups)", new:true, authored_by:"The Weeknight Realist", recipe:{ingredients:["700g frozen chicken nuggets or tenders","750g frozen potato wedges","2 cups corn kernels (frozen or tinned)","Ketchup to serve","Extra lettuce & cucumber, dressed with a little olive oil and salt, for an adults' side salad (optional)"], method:["Preheat oven to 220°C (fan-forced if possible) and line one or two trays.","Spread the nuggets and wedges out in a single layer, leaving space between pieces so they crisp up.","Bake according to packet timing (usually 18-20 min for nuggets, 20-25 min for wedges), turning everything once halfway.","Warm or steam the corn in the last 5 min.","Toss the extra lettuce and cucumber with a little olive oil and salt for an adults' side salad, if wanted.","Serve nuggets, wedges and corn with ketchup — about the lowest-effort dinner of the week, a good reset after a busy pizza night."]}}, lunch:{name:"Fried rice (Thursday's leftovers)"}, snack:{name:"Rice crackers"}},
      {day:"Saturday", dinner:{name:"Crumbed salmon 'fish fingers', potato gems & peas", new:false, authored_by:"The Family GP/Dietician & The Child Nutritionist", recipe:{ingredients:["600g skinless salmon fillets, cut into finger-width strips","1/2 cup flour","2 eggs, beaten","1.5 cups panko breadcrumbs","Frozen potato gems and peas to serve","Ketchup to serve"], method:["Preheat oven to 200°C (400°F) and line a tray.","Set up three shallow bowls: flour, beaten egg, and panko.","Coat each salmon strip in flour, then egg, then panko, pressing the crumbs on firmly.","Lay on the tray, spray lightly with oil, and bake 12-15 min, turning once, until golden and just cooked through.","Bake potato gems on a separate tray alongside, and steam or microwave the peas.","Serve with ketchup — same crumbed-and-fried approach that worked well with flathead, in a different shape to the patty style that didn't land with Hamish before."]}}, lunch:{name:"Chicken nugget & wedge wraps (Friday's leftovers)"}, snack:{name:"Lactose-free yoghurt pouch (or fresh fruit if unavailable)"}},
      {day:"Sunday", dinner:{name:"Roast chicken, roast potatoes, broccoli & a lighter gravy", new:false, authored_by:"The Weeknight Realist & The Family GP/Dietician", recipe:{ingredients:["1 whole chicken (~1.8kg)","1.5kg potatoes, quartered","1 tbsp olive oil","2 cloves garlic","1 lemon, halved","A few sprigs thyme","1 tbsp flour","2 cups chicken stock (for gravy)","1 head broccoli, steamed"], method:["Preheat oven to 200°C (400°F).","Pat the chicken dry, rub with oil, salt and pepper; stuff the cavity with garlic, lemon and thyme.","Place chicken in a large roasting tray, scatter potatoes around it tossed in oil, salt and pepper.","Roast 70-80 min until juices run clear and potatoes are golden, basting once halfway.","Rest chicken 10 min. Skim off as much fat as possible from the pan juices (more thoroughly than usual), whisk in the flour over heat, then gradually add stock, simmering until thickened, for a lighter gravy — serve it sparingly on the side, since rich, fatty foods have been giving Genevieve indigestion.","Steam broccoli and serve alongside — Maddie's favourite way to have it."]}}, lunch:{name:"Salmon finger wraps (Saturday's leftovers)"}, snack:{name:"Cheese and crackers"}}
    ],
    shopping_list: {
      "Produce": ["Broccoli (2 heads)", "Avocados (2)", "Shredded lettuce (1 bag)", "Corn kernels (2 cups, fresh or tinned)", "Onion (2)", "Garlic (1 bulb)", "Ginger (small knob)", "Lemon (1)", "Fresh thyme", "Spring onions (2)", "Bananas (1 bunch)", "Apples (4)", "Mandarins (1 bag)", "Potatoes (1.5kg)", "Cucumber (2)"],
      "Meat & deli": ["Chicken thighs, boneless skinless (8, ~1.2kg)", "Beef mince, lean (500g)", "Sausages (6, ~500g)", "Bacon (4 rashers)", "Salmon fillets, skinless (600g)", "Whole chicken (~1.8kg)"],
      "Dairy": ["Grated cheese (block) + a lactose-free block for Maddie's portions", "Sour cream", "Parmesan (small wedge, adults only)", "Butter", "Eggs (1 dozen)", "Lactose-free yoghurt pouches x2-4"],
      "Pantry": ["Jasmine or long-grain rice (2kg bag)", "Soy sauce", "Honey", "Rice vinegar", "Cornstarch", "Hard taco shells (Old El Paso, 12)", "Taco seasoning (Old El Paso packet)", "Plain flour", "Panko breadcrumbs", "Chicken stock", "Rice crackers", "Popcorn kernels", "Peanut butter", "Ketchup"],
      "Frozen": ["Peas", "Frozen peas & corn mix", "Potato gems", "Chicken nuggets or tenders, frozen (~700g)", "Potato wedges, frozen (~750g)"],
      "Other": []
    }
  };

  const PRINCIPLES_TEXT = `- Favor low-cleanup/one-pan (or one-pan-plus-one-pot) dinners on weeknights
- Lean on 'build-your-own' formats (tacos, pizza, etc.) as a reliable way to introduce variety without a fight
- Keep serving nutrition-forward meals (salmon, roast veg) even when not popular with the kids yet - look for kid-friendlier formats rather than dropping them
- OK to hide vegetables in kid portions when it helps a dish land (e.g. blended into a sauce or mac and cheese)
- Lunches and snacks should have real variety across the week, same as dinners - not a fixed rotation
- Ensure avoid heavy rich foods as these give Genevieve indigestion.
- Lunches and snacks are designed for adults rather than kids please
- No strict repeat-avoidance rule - use judgment on spacing repeats rather than a fixed week count
- Seasonal: household is in Australia - winter (Jun-Aug) prioritise hot dinners/lunches, summer (Dec-Feb) prioritise grilled food and salads
- Maddie: mildly lactose intolerant (moderate dairy, lactose-free swaps where easy) and dislikes tomatoes/tomato sauce (offer a tomato-free option on build-your-own nights); states she dislikes salmon but keep gently offering it in kid-friendly formats
- Hamish: avoid broccoli-forward dishes as the main event, salmon patties (crumbed 'fish finger' shape works better), roast veg stacks, and pie fillings — all previously flopped
- Genevieve: prone to indigestion from rich/heavy food - go easy on cream, butter, deep-frying, and heavy cheese where possible`;

  // Which meals have been logged on THIS device (cosmetic only — the real record is the Sheet)
  let loggedLocally = {};
  try { loggedLocally = JSON.parse(localStorage.getItem('menu-hub-logged:' + WEEK_DATA.week_id) || '{}'); } catch(e) { loggedLocally = {}; }
  function markLoggedLocally(day, meal){
    loggedLocally[key(day,meal)] = true;
    try { localStorage.setItem('menu-hub-logged:' + WEEK_DATA.week_id, JSON.stringify(loggedLocally)); } catch(e){}
  }

  function key(day, meal){ return day + "-" + meal; }

  // Fire-and-forget POST to the Apps Script endpoint. Uses no-cors + text/plain so it
  // doesn't trigger a CORS preflight (Apps Script web apps don't handle preflight well).
  // That also means we can't read a real success/failure response — this always resolves
  // once the request is sent, not once it's confirmed received.
  function sendToSheet(payload){
    if(!FEEDBACK_ENDPOINT || FEEDBACK_ENDPOINT.indexOf('PASTE_') === 0){
      return Promise.reject(new Error('Feedback endpoint not configured yet'));
    }
    return fetch(FEEDBACK_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }

  function render(){
    document.getElementById("dateRange").textContent = WEEK_DATA.date_range;
    document.getElementById("statusPill").textContent = WEEK_DATA.status === "proposed"
      ? "Draft — open for feedback"
      : "Tap any meal to log how it went";

    const reviewContainer = document.getElementById("reviewBoxContainer");
    if(WEEK_DATA.status === "proposed"){
      reviewContainer.innerHTML = `
        <div class="dietary-note">Built around Maddie's mild lactose intolerance + tomato dislike, and Hamish's known dislikes (broccoli-forward mains, salmon patties, roast veg stacks, pie filling).</div>
        <div class="review-box">
          <div class="review-title">Got feedback on this plan?</div>
          <div class="review-sub">Send it straight from here — it lands in the same log Claude reads before planning next week.</div>
          <label>Feedback on this week's plan (swaps, concerns, anything)</label>
          <textarea id="planFeedbackInput" placeholder="e.g. can we swap Wednesday's sausage bake for something else?"></textarea>
          <label>Ingredients to use up this week</label>
          <textarea id="useUpInput" placeholder="e.g. half a bag of spinach, leftover ham"></textarea>
          <div class="review-saved-note" id="reviewSavedNote"></div>
          <button class="save-btn" id="saveReviewBtn">Send feedback</button>
        </div>`;
      reviewContainer.querySelector("#saveReviewBtn").addEventListener("click", async ()=>{
        const plan_feedback = reviewContainer.querySelector("#planFeedbackInput").value;
        const use_up = reviewContainer.querySelector("#useUpInput").value;
        const note = reviewContainer.querySelector("#reviewSavedNote");
        if(!plan_feedback && !use_up){ note.textContent = "Add something in one of the boxes first"; return; }
        note.textContent = "Sending…";
        try{
          await sendToSheet({type:"review_feedback", week_id: WEEK_DATA.week_id, plan_feedback, use_up});
          note.textContent = "Sent ✓";
        }catch(e){
          note.textContent = "Couldn't send — reply to our email instead";
        }
      });
    } else {
      reviewContainer.innerHTML = "";
    }

    const plan = document.getElementById("panel-plan");
    plan.innerHTML = WEEK_DATA.days.map(d => {
      const meals = ["lunch","snack","dinner"];
      return `<div class="day-card">
        <div class="day-title">${d.day}</div>
        ${meals.map(m => {
          const info = d[m];
          if(!info) return "";
          const logged = !!loggedLocally[key(d.day,m)];
          return `<div class="meal-row">
            <div class="meal-label">${m}</div>
            <div class="meal-name">${info.name}${info.new ? '<span class="badge-new">new</span>':''}${info.recipe ? ` <button class="recipe-link-btn" data-day="${d.day}" data-meal="${m}">View recipe</button>`:''}</div>
            <button class="feedback-btn ${logged?'logged':''}" data-day="${d.day}" data-meal="${m}" data-name="${info.name}">
              ${logged ? '✓ logged' : 'Log'}
            </button>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    const shop = document.getElementById("panel-shop");
    shop.innerHTML = Object.entries(WEEK_DATA.shopping_list)
      .filter(([cat, items]) => items.length)
      .map(([cat, items]) => `
        <div class="shop-section">
          <div class="shop-cat">${cat}</div>
          ${items.map((it,i) => `
            <label class="shop-item" data-id="${cat}-${i}">
              <input type="checkbox">
              <span>${it}</span>
            </label>`).join("")}
        </div>`).join("") + `<button class="copy-shop-btn" id="copyShopBtn">Copy shopping list to clipboard</button>`;

    plan.querySelectorAll(".feedback-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openModal(btn.dataset.day, btn.dataset.meal, btn.dataset.name));
    });
    plan.querySelectorAll(".recipe-link-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openRecipePage(btn.dataset.day, btn.dataset.meal));
    });
    shop.querySelectorAll(".shop-item").forEach(row=>{
      row.querySelector("input").addEventListener("change", (e)=>{
        row.classList.toggle("checked", e.target.checked);
      });
    });
    document.getElementById("copyShopBtn").addEventListener("click", async (e)=>{
      const lines = [];
      shop.querySelectorAll(".shop-section").forEach(section=>{
        lines.push(section.querySelector(".shop-cat").textContent);
        section.querySelectorAll(".shop-item").forEach(row=>{
          const checked = row.querySelector("input").checked;
          const text = row.querySelector("span").textContent;
          lines.push(`${checked ? "[x]" : "[ ]"} ${text}`);
        });
        lines.push("");
      });
      const text = lines.join("\n").trim();
      try{
        await navigator.clipboard.writeText(text);
        e.target.textContent = "Copied ✓";
        e.target.classList.add("copied");
        setTimeout(()=>{ e.target.textContent = "Copy shopping list to clipboard"; e.target.classList.remove("copied"); }, 2000);
      }catch(err){
        e.target.textContent = "Couldn't copy — select and copy manually";
      }
    });
  }

  function openRecipePage(day, meal){
    const dayData = WEEK_DATA.days.find(d => d.day === day);
    const info = dayData && dayData[meal];
    if(!info || !info.recipe) return;

    const page = document.createElement("div");
    page.className = "recipe-page";
    page.innerHTML = `
      <div class="recipe-page-inner">
        <button class="recipe-close" id="recipeCloseBtn">← Back</button>
        <div class="recipe-title">${info.name}</div>
        ${info.authored_by ? `<div class="recipe-author">Recipe by ${info.authored_by}</div>` : ''}
        <div class="recipe-section-h">Ingredients</div>
        <ul class="recipe-list">
          ${info.recipe.ingredients.map(i => `<li>${i}</li>`).join("")}
        </ul>
        <div class="recipe-section-h">Method</div>
        <ol class="recipe-list recipe-method">
          ${info.recipe.method.map(s => `<li>${s}</li>`).join("")}
        </ol>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#recipeCloseBtn").addEventListener("click", ()=> page.remove());
  }

  let modalState = {day:null, meal:null, kids_ate_it:null, parent_rating:0, note:""};

  function openModal(day, meal, name){
    modalState = {day, meal, kids_ate_it: null, parent_rating: 0, note: ""};

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${name}</h3>
        <div class="meal-sub">${day} · ${meal}</div>

        <div style="font-size:12px;font-weight:600;color:var(--sage-dark);margin-bottom:8px;">Did the kids eat it?</div>
        <div class="btn-row" id="kidsRow">
          <button class="choice-btn" data-v="yes">Yes</button>
          <button class="choice-btn" data-v="mostly">Mostly</button>
          <button class="choice-btn" data-v="no">Not really</button>
        </div>

        <div style="font-size:12px;font-weight:600;color:var(--sage-dark);margin-bottom:8px;">How'd the grown-ups rate it?</div>
        <div class="stars" id="starsRow">
          ${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}">★</span>`).join("")}
        </div>

        <textarea rows="2" placeholder="Optional note (e.g. 'add more sauce next time')" id="noteInput"></textarea>

        <div class="review-saved-note" id="modalStatusNote"></div>
        <button class="save-btn" id="saveFeedbackBtn">Save</button>
        <span class="cancel-link" id="cancelBtn">Cancel</span>
      </div>`;
    document.getElementById("hub").appendChild(backdrop);

    const kidsRow = backdrop.querySelector("#kidsRow");
    kidsRow.querySelectorAll(".choice-btn").forEach(b=>{
      b.addEventListener("click", ()=>{
        modalState.kids_ate_it = b.dataset.v;
        kidsRow.querySelectorAll(".choice-btn").forEach(x=>x.className="choice-btn");
        b.classList.add("sel-"+b.dataset.v);
      });
    });

    const starsRow = backdrop.querySelector("#starsRow");
    function paintStars(){
      starsRow.querySelectorAll(".star").forEach(s=>{
        s.classList.toggle("on", Number(s.dataset.n) <= modalState.parent_rating);
      });
    }
    starsRow.querySelectorAll(".star").forEach(s=>{
      s.addEventListener("click", ()=>{ modalState.parent_rating = Number(s.dataset.n); paintStars(); });
    });

    backdrop.querySelector("#noteInput").addEventListener("input", (e)=> modalState.note = e.target.value);

    backdrop.querySelector("#cancelBtn").addEventListener("click", ()=> backdrop.remove());
    backdrop.querySelector("#saveFeedbackBtn").addEventListener("click", async ()=>{
      const statusNote = backdrop.querySelector("#modalStatusNote");
      statusNote.textContent = "Sending…";
      try{
        await sendToSheet({
          type: "meal_feedback",
          week_id: WEEK_DATA.week_id,
          day: modalState.day,
          meal: modalState.meal,
          meal_name: name,
          kids_ate_it: modalState.kids_ate_it || "",
          parent_rating: modalState.parent_rating || "",
          note: modalState.note || ""
        });
        markLoggedLocally(modalState.day, modalState.meal);
        backdrop.remove();
        render();
      }catch(e){
        statusNote.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  function openPrinciplesPage(){
    const page = document.createElement("div");
    page.className = "recipe-page";
    page.innerHTML = `
      <div class="recipe-page-inner principles-page-inner">
        <button class="recipe-close" id="principlesCloseBtn">← Back</button>
        <div class="recipe-title">Meal Planning Principles</div>
        <textarea id="principlesTextarea" rows="14"></textarea>
        <div class="principles-status-note" id="principlesStatusNote"></div>
        <button class="save-btn" id="principlesUpdateBtn">Update</button>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#principlesTextarea").value = PRINCIPLES_TEXT;
    page.querySelector("#principlesCloseBtn").addEventListener("click", ()=> page.remove());
    page.querySelector("#principlesUpdateBtn").addEventListener("click", async ()=>{
      const text = page.querySelector("#principlesTextarea").value;
      const note = page.querySelector("#principlesStatusNote");
      if(!text.trim()){ note.textContent = "Add some text first"; return; }
      note.textContent = "Sending…";
      try{
        await sendToSheet({type: "principles_update", week_id: WEEK_DATA.week_id, plan_feedback: text});
        note.textContent = "Saved ✓ — applies next time the planner runs";
      }catch(e){
        note.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  document.getElementById("principlesLinkBtn").addEventListener("click", openPrinciplesPage);

  document.querySelectorAll("#hub .tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll("#hub .tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll("#hub .panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-"+tab.dataset.panel).classList.add("active");
    });
  });

  render();
})();
</script>
</body>
</html>
