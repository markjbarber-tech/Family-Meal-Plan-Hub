<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week — Family Menu Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
:root{
  --font-head:'Sora',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono','Roboto Mono',Consolas,monospace;
  --ink:#2A3B4C;
  --ink-soft:#5C6B7A;
  --ink-faint:#8B9AA8;
  --glass:rgba(255,255,255,0.55);
  --glass-strong:rgba(255,255,255,0.78);
  --glass-border:rgba(255,255,255,0.65);
  --teal:#2F8F8A;
  --teal-dark:#236b67;
  --status-proven:#3D8B86;
  --status-new:#C98A3E;
  --status-caution:#C15A4A;
  --white:#ffffff;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  background:linear-gradient(160deg,#CFE0EC 0%,#BFE6E0 45%,#EAF4E6 100%);
  background-attachment:fixed;
  padding-bottom:40px;
}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 0;}

/* Header */
.header{text-align:center;margin-bottom:16px;}
.header h1{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.7rem;margin:0 0 3px;}
.header .sub{font-family:var(--font-mono);font-size:0.72rem;color:var(--ink-soft);letter-spacing:0.03em;}

/* Utility row */
.util-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.util-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--font-head);font-weight:600;font-size:0.78rem;letter-spacing:-0.005em;
  color:var(--teal-dark);
  background:var(--glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
  border-radius:20px;padding:7px 13px;cursor:pointer;
}
.util-btn:hover{background:var(--glass-strong);}
.util-btn:disabled{opacity:0.6;cursor:default;}
.util-btn i{font-size:15px;}
.util-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.refresh-status-note{text-align:center;font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-soft);margin-bottom:14px;min-height:14px;}

/* Tabs */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:16px;padding:5px;margin-bottom:18px;}
.tab{flex:1;font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:0.85rem;text-align:center;padding:9px 4px;background:transparent;color:var(--ink-soft);border:none;border-radius:12px;cursor:pointer;transition:background .15s ease, color .15s ease, box-shadow .15s ease;display:flex;align-items:center;justify-content:center;}
.tab:hover{color:var(--ink);}
.tab.active{background:var(--white);color:var(--teal-dark);box-shadow:0 3px 10px rgba(42,59,76,0.15);}
.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.hidden{display:none;}

/* Review box */
.review-box{background:rgba(255,255,255,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:0.85rem;}
.review-box .rb-title{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1rem;margin-bottom:4px;}
.review-box .rb-sub{font-size:0.78rem;color:var(--ink-soft);margin-bottom:12px;}
.review-box label{display:block;font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);margin-bottom:5px;}
.review-box textarea{width:100%;min-height:52px;border:1px solid var(--glass-border);border-radius:10px;padding:9px 10px;font-family:var(--font-body);font-size:0.85rem;resize:vertical;margin-bottom:10px;background:rgba(255,255,255,0.6);color:var(--ink);}
.review-box textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px;}
.review-saved-note{font-family:var(--font-mono);font-size:0.68rem;color:var(--status-proven);font-weight:600;min-height:14px;margin-bottom:6px;}
.review-submit-btn{width:100%;font-family:var(--font-head);font-weight:600;background:var(--teal);color:var(--white);border:none;padding:10px;border-radius:12px;font-size:0.85rem;cursor:pointer;}
.review-submit-btn:hover{background:var(--teal-dark);}
.review-submit-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}
.review-submit-btn.danger{background:var(--status-caution);}
.review-submit-btn.danger:hover{background:#a3493c;}
.review-submit-btn:disabled{opacity:0.65;cursor:default;}
.budget-toggle-row{display:flex !important;align-items:center;gap:8px;font-family:var(--font-body) !important;font-size:0.82rem !important;text-transform:none !important;color:var(--ink) !important;letter-spacing:normal !important;margin-bottom:12px;cursor:pointer;}
.budget-toggle-row input{accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;}

/* Scoreboard */
.scoreboard{font-family:var(--font-mono);font-size:0.74rem;color:var(--ink-soft);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:9px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.dot.proven{background:var(--status-proven);}
.dot.new{background:var(--status-new);}

/* Day cards */
.days{display:flex;flex-direction:column;gap:14px;}
.day-card{position:relative;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:16px 18px;}
.glow{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%;}
.glow.proven{background:var(--status-proven);box-shadow:0 0 9px 2px rgba(61,139,134,0.55);}
.glow.new{background:var(--status-new);box-shadow:0 0 9px 2px rgba(201,138,62,0.55);}
.day-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.day-name{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.1rem;}
.day-status{font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;color:var(--ink-faint);letter-spacing:0.04em;}
.meal-row{display:flex;align-items:flex-start;gap:10px;font-size:0.86rem;padding:6px 0;border-top:1px solid rgba(42,59,76,0.08);}
.meal-row:first-of-type{border-top:none;}
.meal-label{font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;color:var(--ink-faint);width:44px;flex-shrink:0;padding-top:3px;letter-spacing:0.04em;}
.meal-name{flex:1;}
.meal-name-btn{background:none;border:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;}
.meal-name-btn:hover{text-decoration:underline;}
.meal-name-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.badge-new{font-family:var(--font-mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--status-new);font-weight:600;margin-left:5px;}
.by-line{font-size:0.72rem;color:var(--ink-soft);font-style:italic;display:block;margin-top:1px;}
.log-btn{font-family:var(--font-head);font-size:0.68rem;font-weight:600;color:var(--teal-dark);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:10px;padding:5px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.log-btn.logged{background:var(--teal);color:var(--white);border-color:var(--teal);}
.log-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.remove-meal-btn{background:none;border:none;color:var(--ink-faint);opacity:0.4;padding:5px;cursor:pointer;border-radius:8px;flex-shrink:0;display:flex;align-items:center;font-size:15px;}
.remove-meal-btn:hover{opacity:1;color:var(--status-caution);background:rgba(193,90,74,0.1);}
.remove-meal-btn:focus-visible{opacity:1;outline:3px solid var(--teal);outline-offset:2px;}
.meal-row-empty{align-items:center;}
.add-meal-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-faint);background:none;border:1.5px dashed var(--glass-border);border-radius:10px;padding:8px;cursor:pointer;}
.add-meal-btn:hover{color:var(--teal-dark);border-color:var(--teal);}
.add-meal-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}

/* Shopping */
.shop-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:20px 18px 22px;}
.shop-card h2{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.25rem;margin:0 0 2px;text-align:center;}
.shop-sub{text-align:center;font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-soft);margin-bottom:16px;}
.cat{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal-dark);margin:16px 0 6px;border-bottom:1px solid rgba(42,59,76,0.12);padding-bottom:3px;}
.shop-cat-block:first-of-type .cat{margin-top:0;}
.item{display:flex;align-items:flex-start;gap:9px;padding:4px 0;font-size:0.85rem;cursor:pointer;}
.item input{margin-top:3px;accent-color:var(--teal);width:15px;height:15px;flex-shrink:0;}
.item span{flex:1;}
.item.checked span{text-decoration:line-through;opacity:0.5;}
.copy-btn{display:block;width:100%;margin:18px auto 0;font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;background:var(--teal);color:var(--white);border:none;padding:11px 22px;border-radius:12px;font-size:0.9rem;cursor:pointer;}
.copy-btn:hover{background:var(--teal-dark);}
.copy-btn.copied{background:var(--teal-dark);}
.copy-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}

/* Recipe tab */
.recipe-picker{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
.rp-btn{font-family:var(--font-mono);font-size:0.68rem;white-space:nowrap;background:rgba(255,255,255,0.5);border:1px solid var(--glass-border);padding:7px 12px;border-radius:10px;cursor:pointer;color:var(--ink-soft);}
.rp-btn.active{background:var(--teal);color:var(--white);border-color:var(--teal);}
.rp-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}
.recipe-card{background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:18px;padding:20px 20px 22px;}
.recipe-card h3{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.2rem;margin:0 0 2px;}
.recipe-card .by{font-size:0.75rem;font-style:italic;color:var(--ink-soft);margin-bottom:12px;}
.recipe-card h4{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal-dark);margin:14px 0 6px;}
.recipe-card ul, .recipe-card ol{margin:0;padding-left:22px;font-size:0.86rem;line-height:1.65;}
.recipe-card li{margin-bottom:3px;}
.recipe-card .no-recipe{font-size:0.85rem;color:var(--ink-soft);}

/* Favourite save button (recipe card + favourites list) */
.favourite-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-head);font-weight:600;font-size:0.78rem;color:var(--teal-dark);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:20px;padding:7px 14px;cursor:pointer;margin-bottom:2px;text-decoration:none;}
.favourite-btn.saved{background:var(--teal);color:var(--white);border-color:var(--teal);cursor:default;}
.favourite-btn:disabled{opacity:0.7;}
.favourite-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.favourite-btn.add-link-btn{width:100%;justify-content:center;box-sizing:border-box;margin-top:10px;}
.favourite-status-note{font-family:var(--font-mono);font-size:0.68rem;color:var(--status-proven);margin:4px 0 6px;min-height:14px;}

/* Full-page overlays (Principles / Favourites / Favourite recipe detail) */
.overlay-page{position:fixed;inset:0;background:linear-gradient(160deg,#CFE0EC 0%,#BFE6E0 45%,#EAF4E6 100%);background-attachment:fixed;z-index:60;overflow-y:auto;}
.overlay-inner{max-width:640px;margin:0 auto;padding:26px 16px 40px;}
.overlay-close{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-head);font-size:0.8rem;font-weight:600;color:var(--teal-dark);background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
.overlay-close:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.overlay-title{font-family:var(--font-head);letter-spacing:-0.01em;font-size:1.4rem;font-weight:600;color:var(--ink);margin:0 0 4px;}
.overlay-sub{font-size:0.82rem;color:var(--ink-soft);margin-bottom:16px;}

/* Principles page */
.principles-card{background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:18px;}
.principles-card textarea{width:100%;min-height:280px;font-size:0.85rem;line-height:1.6;font-family:var(--font-body);background:rgba(255,255,255,0.7);border:1px solid var(--glass-border);border-radius:10px;padding:14px;margin-bottom:10px;resize:vertical;color:var(--ink);}
.principles-card textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px;}
.principles-status-note{font-family:var(--font-mono);font-size:0.7rem;color:var(--status-proven);font-weight:600;min-height:14px;margin-bottom:10px;}
.primary-btn{width:100%;font-family:var(--font-head);font-weight:600;background:var(--teal);color:var(--white);border:none;padding:11px;border-radius:12px;font-size:0.88rem;cursor:pointer;}
.primary-btn:hover{background:var(--teal-dark);}
.primary-btn:disabled{opacity:0.6;cursor:default;}
.primary-btn:focus-visible{outline:3px solid var(--status-new);outline-offset:2px;}

/* Favourites list */
.favourite-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:16px 18px;margin-bottom:12px;}
.favourite-card .fav-name{font-family:var(--font-head);letter-spacing:-0.01em;font-weight:600;font-size:1.05rem;margin-bottom:2px;}
.favourite-card .by{font-size:0.75rem;font-style:italic;color:var(--ink-soft);margin-bottom:10px;}
.favourite-card .fav-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.link-btn{font-family:var(--font-head);font-size:0.75rem;font-weight:700;color:var(--teal-dark);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;}
.link-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.request-btn{width:100%;font-family:var(--font-head);font-weight:600;font-size:0.78rem;color:var(--ink-soft);background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:20px;padding:8px 13px;cursor:pointer;}
.request-btn.requested{background:var(--status-proven);color:var(--white);border-color:var(--status-proven);}
.request-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.empty-note{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:14px;padding:16px;font-size:0.85rem;color:var(--ink-soft);}

/* Feedback modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(42,59,76,0.35);display:flex;align-items:flex-end;justify-content:center;z-index:70;}
.modal{background:var(--glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:22px 20px;border:1px solid var(--glass-border);border-bottom:none;}
.modal h3{font-family:var(--font-head);letter-spacing:-0.01em;margin:0 0 3px;font-size:1.15rem;font-weight:600;}
.modal .meal-sub{font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-soft);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.03em;}
.modal-label{font-family:var(--font-mono);font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-faint);margin-bottom:8px;}
.btn-row{display:flex;gap:8px;margin-bottom:16px;}
.stamp{flex:1;font-family:var(--font-mono);font-size:0.72rem;text-align:center;border:1.5px solid var(--ink-faint);color:var(--ink-soft);background:transparent;border-radius:10px;padding:9px 4px;cursor:pointer;text-transform:uppercase;letter-spacing:0.03em;}
.stamp:hover{border-color:var(--ink);color:var(--ink);}
.stamp.sel-yes{border-color:var(--status-proven);color:var(--status-proven);background:rgba(61,139,134,0.12);}
.stamp.sel-mostly{border-color:var(--status-new);color:var(--status-new);background:rgba(201,138,62,0.12);}
.stamp.sel-no{border-color:var(--status-caution);color:var(--status-caution);background:rgba(193,90,74,0.12);}
.stamp:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.stars{display:flex;gap:6px;margin-bottom:16px;}
.star{font-size:26px;cursor:pointer;color:var(--glass-border);line-height:1;background:none;border:none;padding:0;}
.star.on{color:var(--status-new);}
.star:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.modal textarea{width:100%;border:1px solid var(--glass-border);border-radius:10px;padding:10px;font-family:var(--font-body);font-size:0.85rem;resize:none;margin-bottom:14px;background:rgba(255,255,255,0.6);color:var(--ink);}
.modal textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px;}
.modal-status-note{font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-soft);font-weight:600;min-height:16px;margin-bottom:4px;}
.cancel-link{display:block;width:100%;text-align:center;margin-top:10px;font-family:var(--font-body);font-size:0.75rem;color:var(--ink-soft);opacity:0.8;background:none;border:none;cursor:pointer;}
.confirm-text{font-size:0.85rem;line-height:1.5;color:var(--ink);margin:0 0 14px;}
.text-input{width:100%;box-sizing:border-box;border:1px solid var(--glass-border);border-radius:10px;padding:10px;font-family:var(--font-body);font-size:0.85rem;margin-bottom:14px;background:rgba(255,255,255,0.6);color:var(--ink);}
.text-input:focus-visible{outline:3px solid var(--teal);outline-offset:1px;}
.preview-ingredients{font-size:0.85rem;line-height:1.6;max-height:220px;overflow-y:auto;padding-left:20px;margin:0 0 14px;}

.footer-note{font-family:var(--font-mono);font-size:0.66rem;color:var(--ink-soft);opacity:0.65;text-align:center;margin-top:26px;}

/* Pull-to-refresh */
.pull-refresh-indicator{position:fixed;top:0;left:50%;width:34px;height:34px;margin-left:-17px;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal-dark);opacity:0;transform:translate(-50%,-40px);transition:transform .15s ease;z-index:80;pointer-events:none;}
.pull-refresh-indicator.checking i{animation:pull-spin 0.8s linear infinite;}
@keyframes pull-spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--white);font-family:var(--font-head);font-size:0.8rem;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .2s ease, transform .2s ease;z-index:90;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){*{transition:none !important;} .pull-refresh-indicator.checking i{animation:none !important;}}
</style>
</head>
<body>
<div class="wrap" id="hub">

  <div class="header">
    <h1 id="headerTitle">This week</h1>
    <div class="sub" id="headerSub">—</div>
  </div>

  <div class="util-row">
    <button class="util-btn" id="principlesLinkBtn"><i class="ti ti-clipboard-list"></i>Principles</button>
    <button class="util-btn" id="refreshPlanBtn"><i class="ti ti-refresh"></i>Refresh plan</button>
    <button class="util-btn" id="favouritesLinkBtn"><i class="ti ti-heart"></i>Favourites</button>

    "id": "soy-glazed-baked-chicken-thighs-rice-steamed-broccoli",
    "name": "Soy-glazed baked chicken thighs, rice & steamed broccoli",
    "authored_by": "The Weeknight Realist & The Child Nutritionist",
    "recipe": {
      "ingredients": [
        "Chicken thighs (boneless, skinless)",
        "Soy sauce",
        "Honey",
        "Garlic",
        "Ginger",
        "Jasmine rice",
        "Broccoli"
      ],
      "method": [
        "Whisk soy, honey, garlic and ginger; toss chicken to coat.",
        "Bake chicken on a lined tray at 200°C for ~25 min, basting once.",
        "Cook rice; steam broccoli until just tender.",
        "Serve chicken over rice with broccoli on the side."
      ]
    },
    "saved_at": "2026-08-12T05:00:00.567Z",
    "requested_for_next_week": false
  }
];

  let dishStats = {};
  let shoppingState = {};
  let recipeTabIndex = 0;
  let recipeTabInitialized = false;

  function slugify(name){ return String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
  function shopItemKey(cat, name){ return cat + '::' + String(name).toLowerCase(); }
  function key(day, meal){ return day + "-" + meal; }

  const CATEGORY_ORDER = ['produce','meat_deli','dairy','pantry','frozen','other'];
  const CATEGORY_LABELS = {produce:'Produce', meat_deli:'Meat & deli', dairy:'Dairy', pantry:'Pantry', frozen:'Frozen', other:'Other'};

  // Only pluralize count-noun units ("clove" -> "cloves") — abbreviations like g/kg/tbsp/cup
  // read wrong pluralized ("600 gs") and are conventionally left singular in ingredient lists.
  const PLURALIZABLE_UNITS = ['clove','head','bunch','rasher','block','bag','bottle','packet'];
  function formatQuantityUnit(qty, unit){
    if(qty == null || qty === '') return '';
    const qtyStr = Number.isInteger(qty) ? String(qty) : String(Math.round(qty*100)/100);
    if(!unit) return qtyStr;
    const lower = unit.toLowerCase();
    const pluralUnit = (PLURALIZABLE_UNITS.includes(lower) && qty !== 1) ? unit + 's' : unit;
    return `${qtyStr} ${pluralUnit}`;
  }
  function formatIngredientLine(x){
    return `${formatQuantityUnit(x.quantity, x.unit)} ${x.name}`.replace(/\s+/g,' ').trim();
  }

  // Computed aggregation across every meal still in the week — dropping a meal drops its
  // ingredients automatically, adding one merges in. Sums quantities only when an ingredient's
  // canonical name AND unit match exactly across meals; otherwise lists them separately
  // (best-effort, per the product spec — not worth a full unit-conversion system).
  function computeShoppingList(days){
    const totals = {};
    days.forEach(d=>{
      ['lunch','snack','dinner'].forEach(m=>{
        const info = d[m];
        if(!info || !info.ingredients) return;
        info.ingredients.forEach(ing=>{
          if(!ing || !ing.name) return;
          const category = CATEGORY_ORDER.includes(ing.category) ? ing.category : 'other';
          const nameKey = String(ing.name).toLowerCase();
          const tKey = category + '::' + nameKey;
          if(!totals[tKey]) totals[tKey] = {category, name: ing.name, quantity: 0, unit: '', hasQty: false, mixedUnits: false};
          const t = totals[tKey];
          if(typeof ing.quantity === 'number'){
            if(!t.hasQty){
              t.quantity = ing.quantity;
              t.unit = ing.unit || '';
              t.hasQty = true;
            } else if((ing.unit || '') === t.unit){
              t.quantity += ing.quantity;
            } else {
              t.mixedUnits = true;
            }
          }
        });
      });
    });
    const byCategory = {};
    CATEGORY_ORDER.forEach(c => byCategory[c] = []);
    Object.values(totals).forEach(t=>{
      const label = (t.hasQty && !t.mixedUnits)
        ? formatIngredientLine({quantity: t.quantity, unit: t.unit, name: t.name})
        : t.name;
      const capitalized = label.charAt(0).toUpperCase() + label.slice(1);
      byCategory[t.category].push({key: shopItemKey(t.category, t.name), label: capitalized});
    });
    return byCategory;
  }

  // Which meals have been logged on THIS device (cosmetic only — the real record is the Sheet)
  let loggedLocally = {};
  try { loggedLocally = JSON.parse(localStorage.getItem('menu-hub-logged:' + WEEK_DATA.week_id) || '{}'); } catch(e) { loggedLocally = {}; }
  function markLoggedLocally(day, meal){
    loggedLocally[key(day,meal)] = true;
    try { localStorage.setItem('menu-hub-logged:' + WEEK_DATA.week_id, JSON.stringify(loggedLocally)); } catch(e){}
  }

  // Fire-and-forget POST to the Apps Script endpoint. Uses no-cors + text/plain so it
  // doesn't trigger a CORS preflight (Apps Script web apps don't handle preflight well).
  // That also means we can't read a real success/failure response — this always resolves
  // once the request is sent, not once it's confirmed received. Used only for write-only,
  // no-response-needed submissions (review feedback, per-meal Log).
  function sendToSheet(payload){
    if(!FEEDBACK_ENDPOINT || FEEDBACK_ENDPOINT.indexOf('PASTE_') === 0){
      return Promise.reject(new Error('Feedback endpoint not configured yet'));
    }
    return fetch(FEEDBACK_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }

  // Regular (readable-response) POST — used wherever we need the server's JSON back
  // (refresh, favourites, shopping sync). Content-Type text/plain keeps this a "simple
  // request" so it still avoids a CORS preflight, but WITHOUT no-cors so the response
  // body is actually readable.
  function postJSON(payload){
    return fetch(FEEDBACK_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  async function fetchDishStats(){
    try{
      const resp = await fetch(FEEDBACK_ENDPOINT + '?action=dish_stats&key=' + encodeURIComponent(READ_KEY));
      const result = await resp.json();
      if(result.status === 'ok') dishStats = result.stats || {};
    }catch(e){ /* leave dishStats empty — everything just renders as "new attempt" */ }
  }

  async function fetchShoppingState(){
    try{
      const resp = await fetch(FEEDBACK_ENDPOINT + '?action=shopping_state&week_id=' + encodeURIComponent(WEEK_DATA.week_id) + '&key=' + encodeURIComponent(READ_KEY));
      const result = await resp.json();
      if(result.status === 'ok') shoppingState = result.state || {};
    }catch(e){ shoppingState = {}; }
  }

  function dishStatus(name){
    const s = dishStats[name];
    return (s && s.status === 'proven') ? 'proven' : 'new';
  }

  function renderReviewBox(){
    const container = document.getElementById("reviewBoxContainer");
    if(WEEK_DATA.status === "proposed"){
      const pantryValue = (WEEK_DATA.pantry_ingredients || []).join(', ');
      container.innerHTML = `
        <div class="review-box">
          <div class="rb-title">Anything to flag before this plan goes out?</div>
          <div class="rb-sub">Note plan changes or fridge/pantry items that need using up — this lands in the same log read before next week's planning.</div>
          <label>Plan feedback</label>
          <textarea id="planFeedbackInput" placeholder="e.g. can we swap Wednesday's sausage bake for something else?"></textarea>
          <label>Ingredients to use up</label>
          <textarea id="useUpInput" placeholder="e.g. half a bag of spinach, leftover ham"></textarea>
          <label>Pantry ingredients to build around</label>
          <textarea id="pantryInput" placeholder="e.g. chicken thighs, capsicum">${pantryValue}</textarea>
          <label class="budget-toggle-row">
            <input type="checkbox" id="budgetSaverInput" ${WEEK_DATA.budget_saver_mode ? 'checked' : ''}>
            <span>Budget Saver Mode — chain meals together to shrink this week's shopping list</span>
          </label>
          <div class="review-saved-note" id="reviewSavedNote"></div>
          <button class="review-submit-btn" id="saveReviewBtn">Send feedback</button>
        </div>`;
      container.querySelector("#saveReviewBtn").addEventListener("click", async ()=>{
        const plan_feedback = container.querySelector("#planFeedbackInput").value;
        const use_up = container.querySelector("#useUpInput").value;
        const pantry_ingredients = container.querySelector("#pantryInput").value;
        const budget_saver_mode = container.querySelector("#budgetSaverInput").checked;
        const note = container.querySelector("#reviewSavedNote");
        const budgetModeChanged = budget_saver_mode !== !!WEEK_DATA.budget_saver_mode;
        if(!plan_feedback && !use_up && !pantry_ingredients && !budgetModeChanged){ note.textContent = "Add something in one of the boxes first"; return; }
        note.textContent = "Sending…";
        try{
          await sendToSheet({type:"review_feedback", week_id: WEEK_DATA.week_id, plan_feedback, use_up, pantry_ingredients, budget_saver_mode});
          note.textContent = "Sent ✓";
        }catch(e){
          note.textContent = "Couldn't send — reply to our email instead";
        }
      });
    } else {
      container.innerHTML = "";
    }
  }

  function renderScoreboard(){
    const el = document.getElementById("scoreboard");
    let proven = 0, fresh = 0;
    WEEK_DATA.days.forEach(d=>{
      if(!d.dinner) return;
      if(dishStatus(d.dinner.name) === 'proven') proven++; else fresh++;
    });
    el.innerHTML = `
      <span><span class="dot proven"></span>proven winner &nbsp;&nbsp;<span class="dot new"></span>new attempt</span>
      <span>${proven} proven · ${fresh} new this week</span>`;
  }

  function renderDays(){
    const list = document.getElementById('days-list');
    list.innerHTML = WEEK_DATA.days.map((d, dayIndex) => {
      const status = d.dinner ? dishStatus(d.dinner.name) : 'new';
      const meals = ["lunch","snack","dinner"];
      return `<div class="day-card">
        <div class="glow ${status}"></div>
        <div class="day-head">
          <span class="day-name">${d.day}</span>
          <span class="day-status">${status === 'proven' ? 'proven' : 'new attempt'}</span>
        </div>
        ${meals.map(m=>{
          const info = d[m];
          if(!info){
            return `<div class="meal-row meal-row-empty">
              <span class="meal-label">${m}</span>
              <button class="add-meal-btn" data-day="${d.day}" data-meal="${m}"><i class="ti ti-plus"></i>Add a meal</button>
            </div>`;
          }
          const logged = !!loggedLocally[key(d.day,m)];
          const hasRecipe = m === 'dinner' && info.method;
          const nameHtml = `${info.name}${info.new ? '<span class="badge-new">new</span>':''}${m==='dinner' && info.authored_by ? `<span class="by-line">${info.authored_by}</span>` : ''}`;
          const nameEl = hasRecipe
            ? `<button class="meal-name meal-name-btn" data-day-index="${dayIndex}">${nameHtml}</button>`
            : `<span class="meal-name">${nameHtml}</span>`;
          return `<div class="meal-row">
            <span class="meal-label">${m}</span>
            ${nameEl}
            <button class="log-btn ${logged?'logged':''}" data-day="${d.day}" data-meal="${m}" data-name="${info.name}">${logged ? '✓ Logged' : 'Log'}</button>
            <button class="remove-meal-btn" data-day="${d.day}" data-meal="${m}" data-name="${info.name}" aria-label="Remove ${info.name}"><i class="ti ti-trash"></i></button>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");
    list.querySelectorAll(".log-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openModal(btn.dataset.day, btn.dataset.meal, btn.dataset.name));
    });
    list.querySelectorAll(".meal-name-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> goToRecipe(parseInt(btn.dataset.dayIndex, 10)));
    });
    list.querySelectorAll(".remove-meal-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openRemoveConfirm(btn.dataset.day, btn.dataset.meal, btn.dataset.name));
    });
    list.querySelectorAll(".add-meal-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openAddMealPicker(btn.dataset.day, btn.dataset.meal));
    });
  }

  function renderPlan(){
    renderReviewBox();
    renderScoreboard();
    renderDays();
  }

  function renderShopping(){
    document.getElementById("shopSub").textContent = "WEEK OF " + WEEK_DATA.date_range.toUpperCase();
    const shop = document.getElementById("shopping-list");
    const byCategory = computeShoppingList(WEEK_DATA.days);
    shop.innerHTML = CATEGORY_ORDER
      .filter(cat => byCategory[cat].length)
      .map(cat => `
        <div class="shop-cat-block">
          <div class="cat">${CATEGORY_LABELS[cat]}</div>
          ${byCategory[cat].map((it) => {
            const checked = !!shoppingState[it.key];
            return `
            <label class="item ${checked?'checked':''}" data-key="${it.key}">
              <input type="checkbox" ${checked?'checked':''}>
              <span>${it.label}</span>
            </label>`;
          }).join("")}
        </div>`).join("") || `<div class="no-recipe">Nothing on the list — every meal this week is a leftover or has no tracked ingredients.</div>`;
    shop.querySelectorAll(".item").forEach(row=>{
      row.querySelector("input").addEventListener("change", async (e)=>{
        const checked = e.target.checked;
        row.classList.toggle("checked", checked);
        const itemKey = row.dataset.key;
        shoppingState[itemKey] = checked;
        try{
          await postJSON({type:"toggle_shopping_item", week_id: WEEK_DATA.week_id, item_key: itemKey, checked: checked});
        }catch(err){ /* optimistic UI already applied; next reload resyncs from the server */ }
      });
    });
  }

  document.getElementById("copy-btn").addEventListener("click", async (e)=>{
    const byCategory = computeShoppingList(WEEK_DATA.days);
    const lines = [];
    CATEGORY_ORDER.forEach(cat=>{
      const items = byCategory[cat];
      if(!items.length) return;
      lines.push(CATEGORY_LABELS[cat].toUpperCase());
      items.forEach(it => lines.push('- ' + it.label));
      lines.push("");
    });
    const text = lines.join("\n").trim();
    try{
      await navigator.clipboard.writeText(text);
      e.target.textContent = "Copied ✓";
      e.target.classList.add("copied");
      setTimeout(()=>{ e.target.textContent = "Copy list"; e.target.classList.remove("copied"); }, 2000);
    }catch(err){
      e.target.textContent = "Couldn't copy — select and copy manually";
    }
  });

  function renderRecipeTab(){
    const picker = document.getElementById('recipe-picker');
    picker.innerHTML = WEEK_DATA.days.map((d,i) => `<button class="rp-btn ${i===recipeTabIndex?'active':''}" data-i="${i}">${d.day.slice(0,3)}</button>`).join('');
    picker.querySelectorAll('.rp-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        picker.querySelectorAll('.rp-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderRecipeCard(parseInt(btn.dataset.i, 10));
      });
    });
    renderRecipeCard(recipeTabIndex);
  }

  function renderRecipeCard(i){
    recipeTabIndex = i;
    const d = WEEK_DATA.days[i];
    const card = document.getElementById('recipe-card');
    const info = d.dinner;
    if(!info){
      card.innerHTML = `<div class="no-recipe">No dinner planned for ${d.day} yet — add one from the Plan tab.</div>`;
      return;
    }
    const isExternal = info.source && info.source.type === 'external_url';
    const favId = slugify(info.name);
    const alreadySaved = FAVOURITES.some(f => f.id === favId);
    const ingredientsHtml = (info.ingredients || []).map(x => `<li>${x.display || formatIngredientLine(x)}</li>`).join('');
    card.innerHTML = `
      <h3>${info.name}</h3>
      ${info.authored_by ? `<div class="by">${info.authored_by}</div>` : ''}
      <button class="favourite-btn ${alreadySaved?'saved':''}" id="recipeSaveFavBtn" ${alreadySaved?'disabled':''}>
        <i class="ti ti-heart"></i>${alreadySaved ? 'Saved to favourites' : 'Save to favourites'}
      </button>
      <div class="favourite-status-note" id="recipeSaveFavNote"></div>
      <h4>Ingredients</h4>
      <ul>${ingredientsHtml}</ul>
      ${isExternal
        ? `<h4>Method</h4><a class="favourite-btn" href="${info.source.url}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>View full recipe</a>`
        : (info.method ? `<h4>Method</h4><ol>${info.method.map(x=>`<li>${x}</li>`).join('')}</ol>` : '')}
    `;
    if(!alreadySaved){
      card.querySelector("#recipeSaveFavBtn").addEventListener("click", ()=>
        saveFavouriteFlow(info.name, info.authored_by, info, card.querySelector("#recipeSaveFavBtn"), card.querySelector("#recipeSaveFavNote")));
    }
  }

  async function saveFavouriteFlow(name, authored_by, info, btn, note){
    btn.disabled = true;
    note.textContent = "Saving…";
    const recipe = {
      ingredients: (info.ingredients || []).map(x => x.display || formatIngredientLine(x)),
      method: info.method || []
    };
    try{
      const result = await postJSON({type: "save_favourite", name: name, authored_by: authored_by, recipe: recipe});
      if(result.status === "ok"){
        FAVOURITES = result.favourites;
        btn.innerHTML = '<i class="ti ti-heart"></i>Saved to favourites';
        btn.classList.add("saved");
        note.textContent = "Saved ✓ — find it under Favourites";
      } else {
        note.textContent = "Couldn't save: " + (result.message || "unknown error");
        btn.disabled = false;
      }
    }catch(e){
      note.textContent = "Couldn't reach the server — try again in a moment.";
      btn.disabled = false;
    }
  }

  // Applies a fresh week_data payload from the server (remove/regenerate meal, add external
  // recipe, refresh plan) and re-renders every view that depends on it.
  function applyWeekPatch(newWeekData){
    Object.assign(WEEK_DATA, newWeekData);
    renderPlan();
    renderShopping();
    if(recipeTabInitialized) renderRecipeTab();
  }

  function openRemoveConfirm(day, meal, name){
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Remove this meal?</h3>
        <div class="meal-sub">${day} · ${meal}</div>
        <p class="confirm-text">Remove "${name}" from ${day}'s ${meal}? The slot will be left empty until you add something new.</p>
        <div class="modal-status-note" id="removeStatusNote"></div>
        <button class="review-submit-btn danger" id="confirmRemoveBtn">Remove</button>
        <button class="cancel-link" id="cancelRemoveBtn">Cancel</button>
      </div>`;
    document.getElementById("hub").appendChild(backdrop);
    backdrop.querySelector("#cancelRemoveBtn").addEventListener("click", ()=> backdrop.remove());
    backdrop.querySelector("#confirmRemoveBtn").addEventListener("click", async ()=>{
      const btn = backdrop.querySelector("#confirmRemoveBtn");
      const note = backdrop.querySelector("#removeStatusNote");
      btn.disabled = true; btn.textContent = "Removing…";
      try{
        const result = await postJSON({type:"remove_meal", week_id: WEEK_DATA.week_id, day, meal});
        if(result.status === "ok"){
          applyWeekPatch(result.week_data);
          backdrop.remove();
        } else {
          note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't remove: ${result.message || 'unknown error'}`;
          btn.disabled = false; btn.textContent = "Remove";
        }
      }catch(e){
        note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't reach the server — try again.`;
        btn.disabled = false; btn.textContent = "Remove";
      }
    });
  }

  function openAddMealPicker(day, meal){
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Add a meal</h3>
        <div class="meal-sub">${day} · ${meal}</div>
        <button class="review-submit-btn" id="genMealBtn"><i class="ti ti-sparkles"></i> Generate a meal</button>
        <button class="favourite-btn add-link-btn" id="linkMealBtn"><i class="ti ti-link"></i> Add from a link</button>
        <button class="cancel-link" id="cancelAddBtn">Cancel</button>
      </div>`;
    document.getElementById("hub").appendChild(backdrop);
    backdrop.querySelector("#cancelAddBtn").addEventListener("click", ()=> backdrop.remove());
    backdrop.querySelector("#genMealBtn").addEventListener("click", ()=> regenerateMealFlow(day, meal, backdrop));
    backdrop.querySelector("#linkMealBtn").addEventListener("click", ()=> showAddFromLinkForm(day, meal, backdrop));
  }

  async function regenerateMealFlow(day, meal, backdrop){
    const modal = backdrop.querySelector(".modal");
    modal.innerHTML = `<h3>Generating…</h3><div class="meal-sub">${day} · ${meal}</div><div class="modal-status-note">This can take up to a minute.</div>`;
    try{
      const result = await postJSON({type:"regenerate_meal", week_id: WEEK_DATA.week_id, day, meal});
      if(result.status === "ok"){
        applyWeekPatch(result.week_data);
        backdrop.remove();
      } else {
        renderRegenerateRetry(day, meal, backdrop, result.message || "Unknown error");
      }
    }catch(e){
      renderRegenerateRetry(day, meal, backdrop, "Couldn't reach the server.");
    }
  }

  function renderRegenerateRetry(day, meal, backdrop, message){
    const modal = backdrop.querySelector(".modal");
    modal.innerHTML = `
      <h3>Couldn't generate a meal</h3>
      <div class="meal-sub">${day} · ${meal}</div>
      <div class="modal-status-note"><i class="ti ti-alert-triangle"></i> ${message}</div>
      <button class="review-submit-btn" id="retryGenBtn">Try again</button>
      <button class="cancel-link" id="cancelGenBtn">Cancel</button>`;
    modal.querySelector("#cancelGenBtn").addEventListener("click", ()=> backdrop.remove());
    modal.querySelector("#retryGenBtn").addEventListener("click", ()=> regenerateMealFlow(day, meal, backdrop));
  }

  function showAddFromLinkForm(day, meal, backdrop){
    const modal = backdrop.querySelector(".modal");
    modal.innerHTML = `
      <h3>Add from a link</h3>
      <div class="meal-sub">${day} · ${meal}</div>
      <label class="modal-label">Recipe URL</label>
      <input type="url" id="recipeUrlInput" class="text-input" placeholder="https://example.com/recipe">
      <div class="modal-status-note" id="linkFetchNote"></div>
      <button class="review-submit-btn" id="fetchLinkBtn">Fetch recipe</button>
      <button class="cancel-link" id="cancelLinkBtn">Cancel</button>`;
    modal.querySelector("#cancelLinkBtn").addEventListener("click", ()=> backdrop.remove());
    modal.querySelector("#fetchLinkBtn").addEventListener("click", async ()=>{
      const url = modal.querySelector("#recipeUrlInput").value.trim();
      const note = modal.querySelector("#linkFetchNote");
      const btn = modal.querySelector("#fetchLinkBtn");
      if(!url){ note.textContent = "Paste a URL first"; return; }
      btn.disabled = true; btn.textContent = "Fetching…"; note.textContent = "";
      try{
        const result = await postJSON({type:"preview_external_recipe", url});
        if(result.status === "ok"){
          showExternalRecipePreview(day, meal, backdrop, result.recipe);
        } else {
          note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't read that page — try a different link, or generate a meal instead.`;
          btn.disabled = false; btn.textContent = "Fetch recipe";
        }
      }catch(e){
        note.innerHTML = `<i class="ti ti-alert-triangle"></i> Couldn't read that page — try a different link, or generate a meal instead.`;
        btn.disabled = false; btn.textContent = "Fetch recipe";
      }
    });
  }

  function showExternalRecipePreview(day, meal, backdrop, recipe){
    const modal = backdrop.querySelector(".modal");
    modal.innerHTML = `
      <h3>${recipe.title}</h3>
      <div class="meal-sub">${day} · ${meal} · <a href="${recipe.source_url}" target="_blank" rel="noopener">source</a></div>
      <div class="modal-label">Ingredients</div>
      <ul class="preview-ingredients">${recipe.ingredients.map(i => `<li>${i.display || i.name}</li>`).join('')}</ul>
      <div class="modal-status-note" id="confirmLinkNote"></div>
      <button class="review-submit-btn" id="confirmLinkBtn">Add this recipe</button>
      <button class="cancel-link" id="cancelLinkBtn2">Cancel</button>`;
    modal.querySelector("#cancelLinkBtn2").addEventListener("click", ()=> backdrop.remove());
    modal.querySelector("#confirmLinkBtn").addEventListener("click", async ()=>{
      const btn = modal.querySelector("#confirmLinkBtn");
      const note = modal.querySelector("#confirmLinkNote");
      btn.disabled = true; btn.textContent = "Adding…";
      try{
        const result = await postJSON({type:"add_external_recipe", week_id: WEEK_DATA.week_id, day, meal, title: recipe.title, source_url: recipe.source_url, ingredients: recipe.ingredients});
        if(result.status === "ok"){
          applyWeekPatch(result.week_data);
          backdrop.remove();
        } else {
          note.textContent = "Couldn't add: " + (result.message || "unknown error");
          btn.disabled = false; btn.textContent = "Add this recipe";
        }
      }catch(e){
        note.textContent = "Couldn't reach the server — try again.";
        btn.disabled = false; btn.textContent = "Add this recipe";
      }
    });
  }

  let modalState = {day:null, meal:null, kids_ate_it:null, parent_rating:0, note:""};

  function openModal(day, meal, name){
    modalState = {day, meal, kids_ate_it: null, parent_rating: 0, note: ""};

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${name}</h3>
        <div class="meal-sub">${day} · ${meal}</div>

        <div class="modal-label">Did the kids eat it?</div>
        <div class="btn-row" id="kidsRow">
          <button class="stamp" data-v="yes">Yes</button>
          <button class="stamp" data-v="mostly">Mostly</button>
          <button class="stamp" data-v="no">Not really</button>
        </div>

        <div class="modal-label">How'd the grown-ups rate it?</div>
        <div class="stars" id="starsRow">
          ${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-n="${n}">★</button>`).join("")}
        </div>

        <textarea rows="2" placeholder="Optional note (e.g. 'add more sauce next time')" id="noteInput"></textarea>

        <div class="modal-status-note" id="modalStatusNote"></div>
        <button class="review-submit-btn" id="saveFeedbackBtn">Save</button>
        <button class="cancel-link" id="cancelBtn">Cancel</button>
      </div>`;
    document.getElementById("hub").appendChild(backdrop);

    const kidsRow = backdrop.querySelector("#kidsRow");
    kidsRow.querySelectorAll(".stamp").forEach(b=>{
      b.addEventListener("click", ()=>{
        modalState.kids_ate_it = b.dataset.v;
        kidsRow.querySelectorAll(".stamp").forEach(x=>x.className="stamp");
        b.classList.add("sel-"+b.dataset.v);
      });
    });

    const starsRow = backdrop.querySelector("#starsRow");
    function paintStars(){
      starsRow.querySelectorAll(".star").forEach(s=>{
        s.classList.toggle("on", Number(s.dataset.n) <= modalState.parent_rating);
      });
    }
    starsRow.querySelectorAll(".star").forEach(s=>{
      s.addEventListener("click", ()=>{ modalState.parent_rating = Number(s.dataset.n); paintStars(); });
    });

    backdrop.querySelector("#noteInput").addEventListener("input", (e)=> modalState.note = e.target.value);

    backdrop.querySelector("#cancelBtn").addEventListener("click", ()=> backdrop.remove());
    backdrop.querySelector("#saveFeedbackBtn").addEventListener("click", async ()=>{
      const statusNote = backdrop.querySelector("#modalStatusNote");
      statusNote.textContent = "Sending…";
      try{
        await sendToSheet({
          type: "meal_feedback",
          week_id: WEEK_DATA.week_id,
          day: modalState.day,
          meal: modalState.meal,
          meal_name: name,
          kids_ate_it: modalState.kids_ate_it || "",
          parent_rating: modalState.parent_rating || "",
          note: modalState.note || ""
        });
        markLoggedLocally(modalState.day, modalState.meal);
        backdrop.remove();
        renderDays();
      }catch(e){
        statusNote.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  function openPrinciplesPage(){
    const page = document.createElement("div");
    page.className = "overlay-page";
    page.innerHTML = `
      <div class="overlay-inner">
        <button class="overlay-close" id="principlesCloseBtn"><i class="ti ti-arrow-left"></i>Back</button>
        <div class="overlay-title">Meal planning principles</div>
        <div class="principles-card">
          <textarea id="principlesTextarea" rows="14"></textarea>
          <div class="principles-status-note" id="principlesStatusNote"></div>
          <button class="primary-btn" id="principlesUpdateBtn">Update</button>
        </div>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#principlesTextarea").value = PRINCIPLES_TEXT;
    page.querySelector("#principlesCloseBtn").addEventListener("click", ()=> page.remove());
    page.querySelector("#principlesUpdateBtn").addEventListener("click", async ()=>{
      const text = page.querySelector("#principlesTextarea").value;
      const note = page.querySelector("#principlesStatusNote");
      if(!text.trim()){ note.textContent = "Add some text first"; return; }
      note.textContent = "Sending…";
      try{
        await sendToSheet({type: "principles_update", week_id: WEEK_DATA.week_id, plan_feedback: text});
        note.textContent = "Saved ✓ — applies next time the planner runs";
      }catch(e){
        note.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  function openRecipeOverlay(name, authored_by, recipe){
    const page = document.createElement("div");
    page.className = "overlay-page";
    page.innerHTML = `
      <div class="overlay-inner">
        <button class="overlay-close" id="favRecipeCloseBtn"><i class="ti ti-arrow-left"></i>Back</button>
        <div class="recipe-card">
          <h3>${name}</h3>
          ${authored_by ? `<div class="by">${authored_by}</div>` : ''}
          <h4>Ingredients</h4>
          <ul>${recipe.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul>
          <h4>Method</h4>
          <ol>${recipe.method.map(x=>`<li>${x}</li>`).join('')}</ol>
        </div>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#favRecipeCloseBtn").addEventListener("click", ()=> page.remove());
  }

  function openFavouritesPage(){
    const page = document.createElement("div");
    page.className = "overlay-page";
    page.innerHTML = `
      <div class="overlay-inner">
        <button class="overlay-close" id="favouritesCloseBtn"><i class="ti ti-arrow-left"></i>Back</button>
        <div class="overlay-title">Favourites</div>
        <div class="overlay-sub">Save a recipe from the Recipe tab, then request it here to guarantee it appears in next week's plan.</div>
        <div id="favouritesListInner"></div>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#favouritesCloseBtn").addEventListener("click", ()=> page.remove());
    renderFavouritesList(page);
  }

  function renderFavouritesList(page){
    const container = page.querySelector("#favouritesListInner");
    if(!FAVOURITES.length){
      container.innerHTML = `<div class="empty-note">No favourites saved yet — open a dinner's recipe on the Recipe tab and tap "Save to favourites".</div>`;
      return;
    }
    container.innerHTML = FAVOURITES.map(f => `
      <div class="favourite-card">
        <div class="fav-name">${f.name}</div>
        ${f.authored_by ? `<div class="by">${f.authored_by}</div>` : ''}
        <div class="fav-actions">
          <button class="link-btn" data-id="${f.id}" data-action="view">View recipe</button>
          <button class="request-btn ${f.requested_for_next_week?'requested':''}" data-id="${f.id}" data-requested="${f.requested_for_next_week?'1':'0'}">
            ${f.requested_for_next_week ? "✓ Requested for next week — tap to cancel" : "Request for next week's plan"}
          </button>
        </div>
      </div>`).join("");
    container.querySelectorAll('[data-action="view"]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const f = FAVOURITES.find(x => x.id === btn.dataset.id);
        if(f) openRecipeOverlay(f.name, f.authored_by, f.recipe);
      });
    });
    container.querySelectorAll(".request-btn").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.dataset.id;
        const newRequested = btn.dataset.requested !== "1";
        btn.disabled = true;
        btn.textContent = "Updating…";
        try{
          const result = await postJSON({type: "toggle_favourite_request", id: id, requested: newRequested});
          if(result.status === "ok"){
            FAVOURITES = result.favourites;
            renderFavouritesList(page);
          } else {
            btn.textContent = "Couldn't update — try again";
            btn.disabled = false;
          }
        }catch(e){
          btn.textContent = "Couldn't reach the server — try again";
          btn.disabled = false;
        }
      });
    });
  }

  async function requestRegenerate(){
    const btn = document.getElementById("refreshPlanBtn");
    const note = document.getElementById("refreshStatusNote");
    if(btn.disabled) return;
    btn.disabled = true;
    const originalLabel = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-refresh"></i>Refreshing… (up to a minute)';
    note.textContent = "";
    try{
      const result = await postJSON({type: "regenerate_now", week_id: WEEK_DATA.week_id});
      if(result.status === "ok"){
        PRINCIPLES_TEXT = result.principles_text;
        note.textContent = "Updated ✓" + (result.summary ? " — " + result.summary : "");
        await fetchShoppingState();
        applyWeekPatch(result.week_data);
      } else if(result.status === "no_changes"){
        note.textContent = "Nothing new to incorporate — plan is already up to date.";
      } else {
        note.textContent = "Refresh failed: " + (result.message || "unknown error");
      }
    }catch(e){
      note.textContent = "Couldn't reach the refresh service — try again in a moment.";
    }finally{
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    }
  }

  document.getElementById("principlesLinkBtn").addEventListener("click", openPrinciplesPage);
  document.getElementById("refreshPlanBtn").addEventListener("click", requestRegenerate);
  document.getElementById("favouritesLinkBtn").addEventListener("click", openFavouritesPage);

  function switchTab(name){
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("hidden", p.id !== "panel-" + name));
    if(name === "recipe" && !recipeTabInitialized){
      renderRecipeTab();
      recipeTabInitialized = true;
    }
  }

  function goToRecipe(dayIndex){
    recipeTabIndex = dayIndex;
    switchTab("recipe");
    renderRecipeTab();
  }

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=> switchTab(tab.dataset.tab));
  });

  async function init(){
    document.getElementById("headerTitle").textContent = "This week";
    document.getElementById("headerSub").textContent = (WEEK_DATA.date_range || "—").toUpperCase();

    // Render immediately from local data — the plan itself never depends on the network.
    // dish_stats/shopping_state (status badges, checkbox state) are fetched in the
    // background and applied with a re-render once they land, so a slow or cold-started
    // Apps Script backend never leaves the Plan tab looking empty.
    renderPlan();
    renderShopping();

    await Promise.all([fetchDishStats(), fetchShoppingState()]);
    renderPlan();
    renderShopping();
  }

  // ---------------- Pull-to-refresh (app-code updates only, not a data refresh) ----------------
  // GitHub Pages' CDN caches index.html for several minutes, so a check right after a fresh
  // deploy may still report "up to date" until that edge cache expires — an accepted limitation
  // of the static-hosting setup, not a bug in the gesture itself.
  (function initPullToRefresh(){
    let startY = null, pulling = false, currentPull = 0, checking = false;
    const THRESHOLD = 70;
    let initialLastModified = null;

    fetch(location.pathname, {method:'HEAD', cache:'no-store'})
      .then(r => { initialLastModified = r.headers.get('Last-Modified'); })
      .catch(()=>{});

    const indicator = document.createElement('div');
    indicator.className = 'pull-refresh-indicator';
    indicator.innerHTML = '<i class="ti ti-rotate-clockwise"></i>';
    document.body.appendChild(indicator);

    function showToast(msg){
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(()=> t.classList.add('show'));
      setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=> t.remove(), 300); }, 2200);
    }

    function resetIndicator(){
      indicator.classList.remove('pulling','checking');
      indicator.style.opacity = '';
      indicator.style.transform = '';
      currentPull = 0;
    }

    async function checkForUpdate(){
      checking = true;
      indicator.classList.add('checking');
      indicator.classList.remove('pulling');
      try{
        const resp = await fetch(location.pathname, {method:'HEAD', cache:'no-store'});
        const lm = resp.headers.get('Last-Modified');
        if(initialLastModified && lm && lm !== initialLastModified){
          showToast('Updated.');
          setTimeout(()=> location.reload(), 400);
        } else {
          showToast('Up to date.');
        }
      }catch(e){
        showToast("Couldn't check for updates");
      }finally{
        checking = false;
        resetIndicator();
      }
    }

    window.addEventListener('touchstart', (e)=>{
      if(checking) return;
      if(window.scrollY <= 0 && e.touches.length === 1){
        startY = e.touches[0].clientY;
        pulling = true;
      } else {
        startY = null; pulling = false;
      }
    }, {passive:true});

    window.addEventListener('touchmove', (e)=>{
      if(!pulling || startY == null || checking) return;
      const dy = e.touches[0].clientY - startY;
      if(dy > 0 && window.scrollY <= 0){
        currentPull = Math.min(dy, 120);
        indicator.classList.add('pulling');
        indicator.style.opacity = String(Math.min(currentPull / THRESHOLD, 1));
        indicator.style.transform = `translate(-50%, ${Math.min(currentPull, 60) - 34}px) rotate(${currentPull * 3}deg)`;
      } else {
        pulling = false;
      }
    }, {passive:true});

    window.addEventListener('touchend', ()=>{
      if(pulling && currentPull > THRESHOLD && !checking){
        checkForUpdate();
      } else if(!checking){
        resetIndicator();
      }
      pulling = false;
      startY = null;
    }, {passive:true});
  })();

  init();
})();
</script>
