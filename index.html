  try { loggedLocally = JSON.parse(localStorage.getItem('menu-hub-logged:' + WEEK_DATA.week_id) || '{}'); } catch(e) { loggedLocally = {}; }
  function markLoggedLocally(day, meal){
    loggedLocally[key(day,meal)] = true;
    try { localStorage.setItem('menu-hub-logged:' + WEEK_DATA.week_id, JSON.stringify(loggedLocally)); } catch(e){}
  }

  function key(day, meal){ return day + "-" + meal; }

  // Fire-and-forget POST to the Apps Script endpoint. Uses no-cors + text/plain so it
  // doesn't trigger a CORS preflight (Apps Script web apps don't handle preflight well).
  // That also means we can't read a real success/failure response — this always resolves
  // once the request is sent, not once it's confirmed received.
  function sendToSheet(payload){
    if(!FEEDBACK_ENDPOINT || FEEDBACK_ENDPOINT.indexOf('PASTE_') === 0){
      return Promise.reject(new Error('Feedback endpoint not configured yet'));
    }
    return fetch(FEEDBACK_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }

  function render(){
    document.getElementById("dateRange").textContent = WEEK_DATA.date_range;
    document.getElementById("statusPill").textContent = WEEK_DATA.status === "proposed"
      ? "Draft — open for feedback"
      : "Tap any meal to log how it went";

    const reviewContainer = document.getElementById("reviewBoxContainer");
    if(WEEK_DATA.status === "proposed"){
      reviewContainer.innerHTML = `
        <div class="dietary-note">Built around Maddie's mild lactose intolerance + tomato dislike, and Hamish's known dislikes (broccoli-forward mains, salmon patties, roast veg stacks, pie filling).</div>
        <div class="review-box">
          <div class="review-title">Got feedback on this plan?</div>
          <div class="review-sub">Send it straight from here — it lands in the same log Claude reads before planning next week.</div>
          <label>Feedback on this week's plan (swaps, concerns, anything)</label>
          <textarea id="planFeedbackInput" placeholder="e.g. can we swap Wednesday's sausage bake for something else?"></textarea>
          <label>Ingredients to use up this week</label>
          <textarea id="useUpInput" placeholder="e.g. half a bag of spinach, leftover ham"></textarea>
          <div class="review-saved-note" id="reviewSavedNote"></div>
          <button class="save-btn" id="saveReviewBtn">Send feedback</button>
        </div>`;
      reviewContainer.querySelector("#saveReviewBtn").addEventListener("click", async ()=>{
        const plan_feedback = reviewContainer.querySelector("#planFeedbackInput").value;
        const use_up = reviewContainer.querySelector("#useUpInput").value;
        const note = reviewContainer.querySelector("#reviewSavedNote");
        if(!plan_feedback && !use_up){ note.textContent = "Add something in one of the boxes first"; return; }
        note.textContent = "Sending…";
        try{
          await sendToSheet({type:"review_feedback", week_id: WEEK_DATA.week_id, plan_feedback, use_up});
          note.textContent = "Sent ✓";
        }catch(e){
          note.textContent = "Couldn't send — reply to our email instead";
        }
      });
    } else {
      reviewContainer.innerHTML = "";
    }

    const plan = document.getElementById("panel-plan");
    plan.innerHTML = WEEK_DATA.days.map(d => {
      const meals = ["lunch","snack","dinner"];
      return `<div class="day-card">
        <div class="day-title">${d.day}</div>
        ${meals.map(m => {
          const info = d[m];
          if(!info) return "";
          const logged = !!loggedLocally[key(d.day,m)];
          return `<div class="meal-row">
            <div class="meal-label">${m}</div>
            <div class="meal-name">${info.name}${info.new ? '<span class="badge-new">new</span>':''}${info.recipe ? ` <button class="recipe-link-btn" data-day="${d.day}" data-meal="${m}">View recipe</button>`:''}</div>
            <button class="feedback-btn ${logged?'logged':''}" data-day="${d.day}" data-meal="${m}" data-name="${info.name}">
              ${logged ? '✓ logged' : 'Log'}
            </button>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    const shop = document.getElementById("panel-shop");
    shop.innerHTML = Object.entries(WEEK_DATA.shopping_list)
      .filter(([cat, items]) => items.length)
      .map(([cat, items]) => `
        <div class="shop-section">
          <div class="shop-cat">${cat}</div>
          ${items.map((it,i) => `
            <label class="shop-item" data-id="${cat}-${i}">
              <input type="checkbox">
              <span>${it}</span>
            </label>`).join("")}
        </div>`).join("") + `<button class="copy-shop-btn" id="copyShopBtn">Copy shopping list to clipboard</button>`;

    plan.querySelectorAll(".feedback-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openModal(btn.dataset.day, btn.dataset.meal, btn.dataset.name));
    });
    plan.querySelectorAll(".recipe-link-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> openRecipePage(btn.dataset.day, btn.dataset.meal));
    });
    shop.querySelectorAll(".shop-item").forEach(row=>{
      row.querySelector("input").addEventListener("change", (e)=>{
        row.classList.toggle("checked", e.target.checked);
      });
    });
    document.getElementById("copyShopBtn").addEventListener("click", async (e)=>{
      const lines = [];
      shop.querySelectorAll(".shop-section").forEach(section=>{
        lines.push(section.querySelector(".shop-cat").textContent);
        section.querySelectorAll(".shop-item").forEach(row=>{
          const checked = row.querySelector("input").checked;
          const text = row.querySelector("span").textContent;
          lines.push(`${checked ? "[x]" : "[ ]"} ${text}`);
        });
        lines.push("");
      });
      const text = lines.join("\n").trim();
      try{
        await navigator.clipboard.writeText(text);
        e.target.textContent = "Copied ✓";
        e.target.classList.add("copied");
        setTimeout(()=>{ e.target.textContent = "Copy shopping list to clipboard"; e.target.classList.remove("copied"); }, 2000);
      }catch(err){
        e.target.textContent = "Couldn't copy — select and copy manually";
      }
    });
  }

  function openRecipePage(day, meal){
    const dayData = WEEK_DATA.days.find(d => d.day === day);
    const info = dayData && dayData[meal];
    if(!info || !info.recipe) return;
    renderRecipeDetail(info.name, info.authored_by, info.recipe, {showSaveButton:true});
  }

  function slugify(name){
    return String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }

  function renderRecipeDetail(name, authored_by, recipe, opts){
    opts = opts || {};
    const page = document.createElement("div");
    page.className = "recipe-page";
    const favId = slugify(name);
    const alreadySaved = FAVOURITES.some(f => f.id === favId);
    page.innerHTML = `
      <div class="recipe-page-inner">
        <button class="recipe-close" id="recipeCloseBtn">← Back</button>
        <div class="recipe-title">${name}</div>
        ${authored_by ? `<div class="recipe-author">Recipe by ${authored_by}</div>` : ''}
        ${opts.showSaveButton ? `
          <button class="favourite-btn ${alreadySaved?'saved':''}" id="saveFavouriteBtn" ${alreadySaved?'disabled':''}>${alreadySaved ? '★ Saved to favourites' : '☆ Save to favourites'}</button>
          <div class="favourite-status-note" id="favouriteStatusNote"></div>` : ''}
        <div class="recipe-section-h">Ingredients</div>
        <ul class="recipe-list">
          ${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}
        </ul>
        <div class="recipe-section-h">Method</div>
        <ol class="recipe-list recipe-method">
          ${recipe.method.map(s => `<li>${s}</li>`).join("")}
        </ol>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#recipeCloseBtn").addEventListener("click", ()=> page.remove());

    if(opts.showSaveButton){
      page.querySelector("#saveFavouriteBtn").addEventListener("click", async ()=>{
        const btn = page.querySelector("#saveFavouriteBtn");
        const note = page.querySelector("#favouriteStatusNote");
        btn.disabled = true;
        note.textContent = "Saving…";
        try{
          const resp = await fetch(FEEDBACK_ENDPOINT, {
            method: "POST",
            headers: {"Content-Type": "text/plain;charset=utf-8"},
            body: JSON.stringify({type: "save_favourite", name, authored_by, recipe})
          });
          const result = await resp.json();
          if(result.status === "ok"){
            FAVOURITES = result.favourites;
            btn.textContent = "★ Saved to favourites";
            btn.classList.add("saved");
            note.textContent = "Saved ✓ — find it under ❤️ Favourites";
          } else {
            note.textContent = "Couldn't save: " + (result.message || "unknown error");
            btn.disabled = false;
          }
        }catch(e){
          note.textContent = "Couldn't reach the server — try again in a moment.";
          btn.disabled = false;
        }
      });
    }
  }

  function openFavouritesPage(){
    const page = document.createElement("div");
    page.className = "recipe-page";
    page.innerHTML = `
      <div class="recipe-page-inner">
        <button class="recipe-close" id="favouritesCloseBtn">← Back</button>
        <div class="recipe-title">Favourites</div>
        <div class="meal-sub" style="margin-bottom:16px;">Save a recipe from any week's dinners, then request it here to guarantee it appears in next week's plan.</div>
        <div id="favouritesListInner"></div>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#favouritesCloseBtn").addEventListener("click", ()=> page.remove());
    renderFavouritesList(page);
  }

  function renderFavouritesList(page){
    const container = page.querySelector("#favouritesListInner");
    if(!FAVOURITES.length){
      container.innerHTML = `<div class="dietary-note">No favourites saved yet — open any dinner's recipe and tap "Save to favourites".</div>`;
      return;
    }
    container.innerHTML = FAVOURITES.map(f => `
      <div class="day-card favourite-card">
        <div class="day-title">${f.name}</div>
        ${f.authored_by ? `<div class="recipe-author">Recipe by ${f.authored_by}</div>` : ''}
        <button class="recipe-link-btn" data-id="${f.id}" data-action="view">View recipe</button>
        <button class="save-btn favourite-request-btn ${f.requested_for_next_week?'requested':''}" data-id="${f.id}" data-requested="${f.requested_for_next_week?'1':'0'}">
          ${f.requested_for_next_week ? "✓ Requested for next week's plan — tap to cancel" : "Request for next week's plan"}
        </button>
      </div>`).join("");
    container.querySelectorAll('[data-action="view"]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const f = FAVOURITES.find(x => x.id === btn.dataset.id);
        if(f) renderRecipeDetail(f.name, f.authored_by, f.recipe, {showSaveButton:false});
      });
    });
    container.querySelectorAll(".favourite-request-btn").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.dataset.id;
        const newRequested = btn.dataset.requested !== "1";
        btn.disabled = true;
        btn.textContent = "Updating…";
        try{
          const resp = await fetch(FEEDBACK_ENDPOINT, {
            method: "POST",
            headers: {"Content-Type": "text/plain;charset=utf-8"},
            body: JSON.stringify({type: "toggle_favourite_request", id, requested: newRequested})
          });
          const result = await resp.json();
          if(result.status === "ok"){
            FAVOURITES = result.favourites;
            renderFavouritesList(page);
          } else {
            btn.textContent = "Couldn't update — try again";
            btn.disabled = false;
          }
        }catch(e){
          btn.textContent = "Couldn't reach the server — try again";
          btn.disabled = false;
        }
      });
    });
  }

  let modalState = {day:null, meal:null, kids_ate_it:null, parent_rating:0, note:""};

  function openModal(day, meal, name){
    modalState = {day, meal, kids_ate_it: null, parent_rating: 0, note: ""};

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${name}</h3>
        <div class="meal-sub">${day} · ${meal}</div>

        <div style="font-size:12px;font-weight:600;color:var(--sage-dark);margin-bottom:8px;">Did the kids eat it?</div>
        <div class="btn-row" id="kidsRow">
          <button class="choice-btn" data-v="yes">Yes</button>
          <button class="choice-btn" data-v="mostly">Mostly</button>
          <button class="choice-btn" data-v="no">Not really</button>
        </div>

        <div style="font-size:12px;font-weight:600;color:var(--sage-dark);margin-bottom:8px;">How'd the grown-ups rate it?</div>
        <div class="stars" id="starsRow">
          ${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}">★</span>`).join("")}
        </div>

        <textarea rows="2" placeholder="Optional note (e.g. 'add more sauce next time')" id="noteInput"></textarea>

        <div class="review-saved-note" id="modalStatusNote"></div>
        <button class="save-btn" id="saveFeedbackBtn">Save</button>
        <span class="cancel-link" id="cancelBtn">Cancel</span>
      </div>`;
    document.getElementById("hub").appendChild(backdrop);

    const kidsRow = backdrop.querySelector("#kidsRow");
    kidsRow.querySelectorAll(".choice-btn").forEach(b=>{
      b.addEventListener("click", ()=>{
        modalState.kids_ate_it = b.dataset.v;
        kidsRow.querySelectorAll(".choice-btn").forEach(x=>x.className="choice-btn");
        b.classList.add("sel-"+b.dataset.v);
      });
    });

    const starsRow = backdrop.querySelector("#starsRow");
    function paintStars(){
      starsRow.querySelectorAll(".star").forEach(s=>{
        s.classList.toggle("on", Number(s.dataset.n) <= modalState.parent_rating);
      });
    }
    starsRow.querySelectorAll(".star").forEach(s=>{
      s.addEventListener("click", ()=>{ modalState.parent_rating = Number(s.dataset.n); paintStars(); });
    });

    backdrop.querySelector("#noteInput").addEventListener("input", (e)=> modalState.note = e.target.value);

    backdrop.querySelector("#cancelBtn").addEventListener("click", ()=> backdrop.remove());
    backdrop.querySelector("#saveFeedbackBtn").addEventListener("click", async ()=>{
      const statusNote = backdrop.querySelector("#modalStatusNote");
      statusNote.textContent = "Sending…";
      try{
        await sendToSheet({
          type: "meal_feedback",
          week_id: WEEK_DATA.week_id,
          day: modalState.day,
          meal: modalState.meal,
          meal_name: name,
          kids_ate_it: modalState.kids_ate_it || "",
          parent_rating: modalState.parent_rating || "",
          note: modalState.note || ""
        });
        markLoggedLocally(modalState.day, modalState.meal);
        backdrop.remove();
        render();
      }catch(e){
        statusNote.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  function openPrinciplesPage(){
    const page = document.createElement("div");
    page.className = "recipe-page";
    page.innerHTML = `
      <div class="recipe-page-inner principles-page-inner">
        <button class="recipe-close" id="principlesCloseBtn">← Back</button>
        <div class="recipe-title">Meal Planning Principles</div>
        <textarea id="principlesTextarea" rows="14"></textarea>
        <div class="principles-status-note" id="principlesStatusNote"></div>
        <button class="save-btn" id="principlesUpdateBtn">Update</button>
      </div>`;
    document.getElementById("hub").appendChild(page);
    page.querySelector("#principlesTextarea").value = PRINCIPLES_TEXT;
    page.querySelector("#principlesCloseBtn").addEventListener("click", ()=> page.remove());
    page.querySelector("#principlesUpdateBtn").addEventListener("click", async ()=>{
      const text = page.querySelector("#principlesTextarea").value;
      const note = page.querySelector("#principlesStatusNote");
      if(!text.trim()){ note.textContent = "Add some text first"; return; }
      note.textContent = "Sending…";
      try{
        await sendToSheet({type: "principles_update", week_id: WEEK_DATA.week_id, plan_feedback: text});
        note.textContent = "Saved ✓ — applies next time the planner runs";
      }catch(e){
        note.textContent = "Couldn't send — try again in a moment";
      }
    });
  }

  async function requestRegenerate(){
    const btn = document.getElementById("refreshPlanBtn");
    const note = document.getElementById("refreshStatusNote");
    if(btn.disabled) return;
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = "🔄 Refreshing… (up to a minute)";
    note.textContent = "";
    try{
      const resp = await fetch(FEEDBACK_ENDPOINT, {
        method: "POST",
        headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({type: "regenerate_now", week_id: WEEK_DATA.week_id})
      });
      const result = await resp.json();
      if(result.status === "ok"){
        Object.assign(WEEK_DATA, result.week_data);
        PRINCIPLES_TEXT = result.principles_text;
        note.textContent = "Updated ✓" + (result.summary ? " — " + result.summary : "");
        render();
      } else if(result.status === "no_changes"){
        note.textContent = "Nothing new to incorporate — plan is already up to date.";
      } else {
        note.textContent = "Refresh failed: " + (result.message || "unknown error");
      }
    }catch(e){
      note.textContent = "Couldn't reach the refresh service — try again in a moment.";
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  document.getElementById("principlesLinkBtn").addEventListener("click", openPrinciplesPage);
  document.getElementById("refreshPlanBtn").addEventListener("click", requestRegenerate);
  document.getElementById("favouritesLinkBtn").addEventListener("click", openFavouritesPage);

  document.querySelectorAll("#hub .tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll("#hub .tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll("#hub .panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-"+tab.dataset.panel).classList.add("active");
    });
  });

  render();
})();
</script>
</body>
</html>
